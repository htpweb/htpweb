<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PIDE AQUÍ</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f8fafc;color:#111827;margin:0;min-height:100vh;display:grid;place-items:center}
    .box{width:min(420px,90vw);text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 12px 32px #0001}
    .spinner{width:38px;height:38px;border:4px solid #e5e7eb;border-top-color:#e53935;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .muted{color:#64748b}
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner"></div>
    <h2>PIDE AQUÍ</h2>
    <p class="muted">Abriendo el LOCAL...</p>
  </main>
  <script>
    (function(){
      var code=(location.hash||"").replace(/^#/,"").trim().toUpperCase();
      if(!/^[A-F0-9]{6}$/.test(code)){
        document.querySelector(".muted").textContent="Enlace no válido.";
        return;
      }
      location.replace("https://hwfloywzqlgqieonuswl.supabase.co/functions/v1/share-resolve?s="+encodeURIComponent(code));
    })();
  </script>
</body>
</html>
