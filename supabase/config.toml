project_id = "htpweb"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://htpweb.github.io/htpweb/app/acceso.html"
additional_redirect_urls = ["https://htpweb.github.io/htpweb/**"]

[functions.crear-pedido]
verify_jwt = true

[functions.calcular-distancia]
verify_jwt = true

[functions.optimizar-ruta]
verify_jwt = true

[functions.preparar-desvio-ruta]
verify_jwt = true

[functions.delivery-proof-upload]
verify_jwt = true

[functions.delivery-proof-view]
verify_jwt = true

[functions.analizar-menu]
verify_jwt = true

[functions.resolver-google-maps]
verify_jwt = true

[functions.whatsapp-notify]
verify_jwt = false

[functions.share-preview]
verify_jwt = false

[auth.email.template.confirmation]
subject = "HTPWEB | Confirma tu correo electronico"
content_path = "./supabase/templates/confirmation.html"


[functions.share-resolve]
verify_jwt = false


[functions.desktop-gallery-upload]
verify_jwt = false
