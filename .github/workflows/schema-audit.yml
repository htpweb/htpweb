name: HTPWEB Schema Audit

on:
  push:
    branches: [runtime-schema-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify ADMIN RPC surface
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          parsed = urlparse(Path("supabase/.temp/pooler-url").read_text(encoding="utf-8").strip())
          env = os.environ.copy()
          env["PGPASSWORD"] = os.environ["SUPABASE_DB_PASSWORD"]

          names = [
            "analytics_delivery_summary",
            "analytics_local_summary",
            "analytics_master_summary",
            "current_role_code",
            "master_apply_local_request",
            "master_review_local_request",
            "master_save_city",
            "master_save_delivery",
            "master_set_delivery_capability",
            "master_set_local_capability",
            "save_local_category",
            "save_local_product",
            "set_local_order_status",
            "set_order_status",
            "submit_local_request",
            "update_my_delivery_content",
            "update_my_local_content"
          ]

          values = ",".join("'" + x + "'" for x in names)
          sql = f"""
          with expected(name) as (
            select unnest(array[{values}]::text[])
          ),
          actual as (
            select distinct p.proname as name
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
          )
          select 'RPC|' || e.name || '|' ||
                 case when a.name is null then 'MISSING' else 'OK' end
          from expected e
          left join actual a using(name)
          order by e.name;

          select 'TABLE|' || x.name || '|' ||
                 case when to_regclass('public.' || x.name) is null then 'MISSING' else 'OK' end
          from (values
            ('deliveries'),('locals'),('cities'),('orders'),('order_locals'),
            ('local_requests'),('categories'),('products'),('customers'),
            ('user_deliveries'),('user_locals'),('capabilities'),
            ('delivery_capabilities'),('local_capabilities')
          ) as x(name)
          order by x.name;
          """
          subprocess.run(
              ["psql","-h",parsed.hostname,"-p",str(parsed.port),"-U",parsed.username,
               "-d",parsed.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
              check=True, env=env
          )
          PY
