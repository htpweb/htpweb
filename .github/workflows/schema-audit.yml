name: HTPWEB Schema Audit

on:
  push:
    branches: [runtime-schema-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Read schema
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          parsed = urlparse(Path("supabase/.temp/pooler-url").read_text(encoding="utf-8").strip())
          env = os.environ.copy()
          env["PGPASSWORD"] = os.environ["SUPABASE_DB_PASSWORD"]

          tables = "cities,deliveries,locals,local_deliveries,categories,products,product_variants,delivery_fee_configs,delivery_fee_ranges"
          sql = f"""
          select 'COL|' || table_name || '|' || ordinal_position || '|' || column_name || '|' ||
                 data_type || '|' || is_nullable || '|' || coalesce(column_default,'')
          from information_schema.columns
          where table_schema='public' and table_name = any(string_to_array('{tables}', ','))
          order by table_name, ordinal_position;

          select 'CON|' || c.conrelid::regclass::text || '|' || c.conname || '|' || pg_get_constraintdef(c.oid)
          from pg_constraint c
          where c.conrelid in (
            'public.cities'::regclass,
            'public.deliveries'::regclass,
            'public.locals'::regclass,
            'public.local_deliveries'::regclass,
            'public.categories'::regclass,
            'public.products'::regclass,
            'public.product_variants'::regclass,
            'public.delivery_fee_configs'::regclass,
            'public.delivery_fee_ranges'::regclass
          )
          order by c.conrelid::regclass::text, c.conname;
          """
          subprocess.run(
              ["psql","-h",parsed.hostname,"-p",str(parsed.port),"-U",parsed.username,
               "-d",parsed.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
              check=True, env=env
          )
          PY
