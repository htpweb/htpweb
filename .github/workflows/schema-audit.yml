name: HTPWEB Schema Audit

on:
  push:
    branches: [runtime-schema-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Read order functions
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          parsed = urlparse(Path("supabase/.temp/pooler-url").read_text(encoding="utf-8").strip())
          env = os.environ.copy()
          env["PGPASSWORD"] = os.environ["SUPABASE_DB_PASSWORD"]

          sql = """
          select 'FUNC_BEGIN|' || p.proname || E'\\n' || pg_get_functiondef(p.oid) || E'\\nFUNC_END|' || p.proname
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.proname in ('create_order_transaction','calculate_delivery_fee')
          order by p.proname;
          """
          subprocess.run(
              ["psql","-h",parsed.hostname,"-p",str(parsed.port),"-U",parsed.username,
               "-d",parsed.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
              check=True, env=env
          )
          PY
