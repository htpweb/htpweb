name: Codigo 74 Deploy and Verify

on:
  push:
    branches: [codigo-74-disponibilidad-publica-local]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify public availability with rollback
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'PUBLIC_AVAILABILITY_EXISTS|' ||
            (to_regprocedure('public.public_locals_order_availability(uuid[],timestamp with time zone)') is not null);
          select 'PUBLIC_AVAILABILITY_ANON_EXECUTE|' ||
            has_function_privilege(
              'anon',
              'public.public_locals_order_availability(uuid[],timestamp with time zone)',
              'EXECUTE'
            );
          select 'PUBLIC_AVAILABILITY_AUTH_EXECUTE|' ||
            has_function_privilege(
              'authenticated',
              'public.public_locals_order_availability(uuid[],timestamp with time zone)',
              'EXECUTE'
            );

          begin;

          do $$
          declare
            v_local uuid;
            v_result jsonb;
            v_row jsonb;
            v_invalid_blocked boolean := false;
          begin
            select l.id into v_local
            from public.locals l
            where l.active=true
              and public.local_is_public(l.id)
            order by l.created_at
            limit 1;

            if v_local is null then
              raise exception 'Missing public active LOCAL';
            end if;

            delete from public.local_schedules where local_id=v_local;

            v_result := public.public_locals_order_availability(
              array[v_local],
              '2026-09-21 15:00:00+00'::timestamptz
            );
            v_row := v_result->0;

            if (v_row->>'is_open')::boolean is not true
               or v_row->>'reason' <> 'NO_SCHEDULE_CONFIGURED'
            then
              raise exception 'Public no-schedule state failed: %', v_row;
            end if;

            insert into public.local_schedules(
              id,local_id,day_of_week,is_closed,opening_time,closing_time,created_at,updated_at
            )
            values
              (gen_random_uuid(),v_local,1,false,'09:00','17:00',now(),now()),
              (gen_random_uuid(),v_local,2,true,null,null,now(),now());

            v_result := public.public_locals_order_availability(
              array[v_local],
              '2026-09-21 15:00:00+00'::timestamptz
            );
            v_row := v_result->0;
            if (v_row->>'is_open')::boolean is not true
               or v_row->>'reason' <> 'OPEN'
               or v_row->>'closing_time' <> '17:00'
            then
              raise exception 'Public open state failed: %', v_row;
            end if;

            v_result := public.public_locals_order_availability(
              array[v_local],
              '2026-09-22 15:00:00+00'::timestamptz
            );
            v_row := v_result->0;
            if (v_row->>'is_open')::boolean is not false
               or v_row->>'reason' <> 'CLOSED_TODAY'
            then
              raise exception 'Public closed-day state failed: %', v_row;
            end if;

            begin
              perform public.public_locals_order_availability(
                array['00000000-0000-4000-8000-000000000099'::uuid],
                now()
              );
            exception when others then
              v_invalid_blocked := true;
            end;

            if not v_invalid_blocked then
              raise exception 'Non-public/nonexistent LOCAL was not blocked';
            end if;

            raise notice 'PUBLIC_NO_SCHEDULE_OK=true';
            raise notice 'PUBLIC_OPEN_STATE_OK=true';
            raise notice 'PUBLIC_CLOSED_STATE_OK=true';
            raise notice 'PUBLIC_INVALID_LOCAL_BLOCK_OK=true';
          end
          $$;

          rollback;
          """

          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
