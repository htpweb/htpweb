name: Codigo 69 Inspect Access

on:
  push:
    branches: [codigo-69-tarifas-delivery]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect RLS permissions capabilities
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy(); env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]
          sql=r"""
          select 'POLICIES';
          select tablename||'|'||policyname||'|'||cmd||'|'||coalesce(qual,'')||'|'||coalesce(with_check,'')
          from pg_policies
          where schemaname='public'
            and tablename in ('delivery_fee_configs','delivery_fee_ranges','zones','delivery_zones')
          order by tablename,policyname;

          select 'ROLE_PERMISSION';
          select r.code||'|'||p.code||'|'||rp.allowed
          from public.role_permissions rp
          join public.roles r on r.id=rp.role_id
          join public.permissions p on p.id=rp.permission_id
          where r.code in ('MASTER','DELIVERY_ADMIN','DELIVERY_OPERATOR')
            and p.code in ('delivery_fees.manage','zones.assign')
          order by r.code,p.code;

          select 'DELIVERY_CAPABILITIES';
          select dc.delivery_id||'|'||c.code||'|'||dc.enabled
          from public.delivery_capabilities dc
          join public.capabilities c on c.id=dc.capability_id
          where c.code in ('delivery_fees.manage','zones.manage')
          order by dc.delivery_id,c.code;

          select 'DEMO_DELIVERY';
          select id||'|'||name||'|'||coalesce(city_id::text,'NULL') from public.deliveries where active=true order by created_at limit 5;

          select 'FEE_CONFIGS';
          select delivery_id||'|'||mode||'|'||fixed_fee||'|'||active from public.delivery_fee_configs order by created_at;

          select 'FEE_RANGES';
          select delivery_id||'|'||distance_from||'|'||distance_to||'|'||fee||'|'||active from public.delivery_fee_ranges order by delivery_id,distance_from;

          select 'DELIVERY_ZONES';
          select delivery_id||'|'||zone_id||'|'||active from public.delivery_zones order by delivery_id,zone_id;

          select 'ZONES';
          select id||'|'||name||'|'||city_id||'|'||active from public.zones order by name limit 50;
          """
          subprocess.run(["psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
            check=True,env=env)
          PY
