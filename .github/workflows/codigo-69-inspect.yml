name: Codigo 69 Inspect Catalog

on:
  push:
    branches: [codigo-69-tarifas-delivery]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify capability catalog
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy(); env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]
          sql=r"""
          select 'CAPABILITIES';
          select code||'|'||scope||'|'||active
          from public.capabilities
          where code in ('delivery_fees.manage','zones.manage')
          order by code;

          select 'PERMISSIONS';
          select code||'|'||active
          from public.permissions
          where code in ('delivery_fees.manage','zones.assign')
          order by code;
          """
          subprocess.run(["psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
            check=True,env=env)
          PY
