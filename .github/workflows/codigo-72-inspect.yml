name: Codigo 72 Verify

on:
  push:
    branches: [codigo-72-catalogo-completo-local]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify catalog RPCs with rollback
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'CATEGORY_AUTH_EXECUTE|' ||
            has_function_privilege(
              'authenticated',
              'public.save_local_category(uuid,uuid,text,text,text,integer,boolean)',
              'EXECUTE'
            );
          select 'CATEGORY_ANON_EXECUTE|' ||
            has_function_privilege(
              'anon',
              'public.save_local_category(uuid,uuid,text,text,text,integer,boolean)',
              'EXECUTE'
            );
          select 'PRODUCT_AUTH_EXECUTE|' ||
            has_function_privilege(
              'authenticated',
              'public.save_local_product(uuid,uuid,uuid,text,text,numeric,text,integer,boolean)',
              'EXECUTE'
            );
          select 'PRODUCT_ANON_EXECUTE|' ||
            has_function_privilege(
              'anon',
              'public.save_local_product(uuid,uuid,uuid,text,text,numeric,text,integer,boolean)',
              'EXECUTE'
            );

          begin;

          do $$
          declare
            v_master uuid;
            v_local uuid;
            v_category uuid;
            v_product uuid;
          begin
            select p.id into v_master
            from public.profiles p
            join public.roles r on r.id=p.role_id
            where p.active=true and r.active=true and r.code='MASTER'
            order by p.created_at
            limit 1;

            select l.id into v_local
            from public.locals l
            where l.active=true
            order by l.created_at
            limit 1;

            if v_master is null or v_local is null then
              raise exception 'Missing MASTER or active LOCAL';
            end if;

            perform set_config('request.jwt.claim.sub', v_master::text, true);

            select public.save_local_category(
              v_local,
              null,
              'HTPWEB VERIFY CATEGORY',
              'Categoría temporal',
              'https://example.invalid/category.webp',
              88,
              true
            ) into v_category;

            if v_category is null then
              raise exception 'Category creation returned null';
            end if;

            perform public.save_local_category(
              v_local,
              v_category,
              'HTPWEB VERIFY CATEGORY EDIT',
              'Categoría temporal editada',
              'https://example.invalid/category.webp',
              87,
              true
            );

            if not exists (
              select 1
              from public.categories c
              where c.id=v_category
                and c.local_id=v_local
                and c.name='HTPWEB VERIFY CATEGORY EDIT'
                and c.description='Categoría temporal editada'
                and c.image_url='https://example.invalid/category.webp'
                and c.display_order=87
                and c.active=true
            ) then
              raise exception 'Category update verification failed';
            end if;

            select public.save_local_product(
              v_local,
              null,
              v_category,
              'HTPWEB VERIFY PRODUCT',
              'Producto temporal',
              10.25,
              'https://example.invalid/product.webp',
              77,
              true
            ) into v_product;

            if v_product is null then
              raise exception 'Product creation returned null';
            end if;

            perform public.save_local_product(
              v_local,
              v_product,
              v_category,
              'HTPWEB VERIFY PRODUCT EDIT',
              'Producto temporal editado',
              11.50,
              'https://example.invalid/product.webp',
              76,
              true
            );

            if not exists (
              select 1
              from public.products p
              where p.id=v_product
                and p.local_id=v_local
                and p.category_id=v_category
                and p.name='HTPWEB VERIFY PRODUCT EDIT'
                and p.description='Producto temporal editado'
                and p.price=11.50
                and p.image_url='https://example.invalid/product.webp'
                and p.display_order=76
                and p.active=true
            ) then
              raise exception 'Product update verification failed';
            end if;

            perform public.save_local_product(
              v_local,
              v_product,
              v_category,
              'HTPWEB VERIFY PRODUCT EDIT',
              'Producto temporal editado',
              11.50,
              'https://example.invalid/product.webp',
              76,
              false
            );

            perform public.save_local_category(
              v_local,
              v_category,
              'HTPWEB VERIFY CATEGORY EDIT',
              'Categoría temporal editada',
              'https://example.invalid/category.webp',
              87,
              false
            );

            if exists (
              select 1 from public.products p
              where p.id=v_product and p.active=true
            ) then
              raise exception 'Product deactivate verification failed';
            end if;

            if exists (
              select 1 from public.categories c
              where c.id=v_category and c.active=true
            ) then
              raise exception 'Category deactivate verification failed';
            end if;

            raise notice 'CATEGORY_CREATE_UPDATE_DEACTIVATE_OK=true';
            raise notice 'PRODUCT_CREATE_UPDATE_DEACTIVATE_OK=true';
            raise notice 'IMAGE_URL_PRESERVATION_OK=true';
          end
          $$;

          rollback;

          select 'VERIFY_CATEGORY_RESIDUE|' || count(*)
          from public.categories
          where name like 'HTPWEB VERIFY CATEGORY%';

          select 'VERIFY_PRODUCT_RESIDUE|' || count(*)
          from public.products
          where name like 'HTPWEB VERIFY PRODUCT%';
          """

          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
