name: Supabase Connection Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-check.yml"

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl

jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          if find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print -quit 2>/dev/null | grep -q .; then
            find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 |
              while IFS= read -r -d '' file; do
                echo "Checking $file"
                deno check --config supabase/functions/deno.json "$file"
              done
          else
            echo "No Edge Functions found."
          fi

      - name: Verify required secrets
        shell: bash
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry-run database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Connection OK
        run: echo "Supabase migration dry-run and Edge Function checks passed."
