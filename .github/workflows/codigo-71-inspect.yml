name: Codigo 71 Inspect Variant RPC

on:
  push:
    branches: [codigo-71-horarios-variantes-local]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect variant RPC and ACL
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy(); env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]
          sql=r"""
          select 'SAVE_PRODUCT_VARIANT_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='save_product_variant';

          select 'FUNCTION_PRIVS';
          select 'save_product_variant|auth='||
            has_function_privilege('authenticated','public.save_product_variant(uuid,uuid,text,numeric,integer,boolean)','EXECUTE')
            ||'|anon='||
            has_function_privilege('anon','public.save_product_variant(uuid,uuid,text,numeric,integer,boolean)','EXECUTE');
          select 'save_local_schedule|auth='||
            has_function_privilege('authenticated','public.save_local_schedule(uuid,smallint,boolean,time without time zone,time without time zone)','EXECUTE')
            ||'|anon='||
            has_function_privilege('anon','public.save_local_schedule(uuid,smallint,boolean,time without time zone,time without time zone)','EXECUTE');

          select 'DEMO_PRODUCTS';
          select p.id||'|'||p.name||'|'||p.local_id||'|'||p.active
          from public.products p
          order by p.created_at;

          select 'DEMO_VARIANTS';
          select v.id||'|'||v.product_id||'|'||v.name||'|'||v.price||'|'||v.active
          from public.product_variants v
          order by v.product_id,v.display_order,v.name;
          """
          subprocess.run(["psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
            check=True,env=env)
          PY
