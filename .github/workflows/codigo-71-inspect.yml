name: Codigo 71 Deploy and Verify

on:
  push:
    branches: [codigo-71-horarios-variantes-local]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify schedules and variants with rollback
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'WEEK_FUNCTION_EXISTS|' ||
            (to_regprocedure('public.save_local_schedule_week(uuid,jsonb)') is not null);
          select 'WEEK_AUTH_EXECUTE|' ||
            has_function_privilege('authenticated','public.save_local_schedule_week(uuid,jsonb)','EXECUTE');
          select 'WEEK_ANON_EXECUTE|' ||
            has_function_privilege('anon','public.save_local_schedule_week(uuid,jsonb)','EXECUTE');
          select 'VARIANT_AUTH_EXECUTE|' ||
            has_function_privilege('authenticated','public.save_product_variant(uuid,uuid,text,numeric,integer,boolean)','EXECUTE');
          select 'VARIANT_ANON_EXECUTE|' ||
            has_function_privilege('anon','public.save_product_variant(uuid,uuid,text,numeric,integer,boolean)','EXECUTE');

          begin;

          do $$
          declare
            v_master uuid;
            v_local uuid;
            v_product uuid;
            v_saved integer;
            v_variant uuid;
            v_count integer;
          begin
            select p.id into v_master
            from public.profiles p
            join public.roles r on r.id=p.role_id
            where p.active=true and r.active=true and r.code='MASTER'
            order by p.created_at
            limit 1;

            select l.id into v_local
            from public.locals l
            where l.active=true
            order by l.created_at
            limit 1;

            select p.id into v_product
            from public.products p
            where p.local_id=v_local and p.active=true
            order by p.created_at
            limit 1;

            if v_master is null or v_local is null or v_product is null then
              raise exception 'Missing MASTER, active LOCAL or active product';
            end if;

            perform set_config('request.jwt.claim.sub', v_master::text, true);

            select public.save_local_schedule_week(
              v_local,
              jsonb_build_array(
                jsonb_build_object('day_of_week',0,'is_closed',true,'opening_time',null,'closing_time',null),
                jsonb_build_object('day_of_week',1,'is_closed',false,'opening_time','09:00','closing_time','17:00'),
                jsonb_build_object('day_of_week',2,'is_closed',true,'opening_time',null,'closing_time',null),
                jsonb_build_object('day_of_week',3,'is_closed',true,'opening_time',null,'closing_time',null),
                jsonb_build_object('day_of_week',4,'is_closed',true,'opening_time',null,'closing_time',null),
                jsonb_build_object('day_of_week',5,'is_closed',true,'opening_time',null,'closing_time',null),
                jsonb_build_object('day_of_week',6,'is_closed',true,'opening_time',null,'closing_time',null)
              )
            ) into v_saved;

            if v_saved <> 7 then
              raise exception 'save_local_schedule_week returned % instead of 7', v_saved;
            end if;

            select count(*) into v_count
            from public.local_schedules s
            where s.local_id=v_local;

            if v_count <> 7 then
              raise exception 'Expected 7 schedule rows, got %', v_count;
            end if;

            select public.save_product_variant(
              v_product,
              null,
              'HTPWEB VERIFY VARIANT',
              12.34,
              99,
              true
            ) into v_variant;

            if v_variant is null then
              raise exception 'save_product_variant returned null';
            end if;

            perform public.save_product_variant(
              v_product,
              v_variant,
              'HTPWEB VERIFY VARIANT',
              13.45,
              98,
              false
            );

            if not exists (
              select 1
              from public.product_variants pv
              where pv.id=v_variant
                and pv.product_id=v_product
                and pv.price=13.45
                and pv.display_order=98
                and pv.active=false
            ) then
              raise exception 'Variant update verification failed';
            end if;

            raise notice 'SCHEDULE_WEEK_RPC_OK=true';
            raise notice 'VARIANT_RPC_OK=true';
          end
          $$;

          rollback;

          select 'VERIFY_VARIANT_RESIDUE|' || count(*)
          from public.product_variants
          where name='HTPWEB VERIFY VARIANT';

          select 'VERIFY_SCHEDULE_TOTAL|' || count(*)
          from public.local_schedules;
          """

          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
