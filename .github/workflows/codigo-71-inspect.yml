name: Codigo 71 Inspect Variant Access

on:
  push:
    branches: [codigo-71-horarios-variantes-local]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify variant and schedule access
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy(); env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]
          sql=r"""
          select 'PERMISSIONS';
          select r.code||'|'||p.code
          from public.role_permissions rp
          join public.roles r on r.id=rp.role_id
          join public.permissions p on p.id=rp.permission_id
          where p.code in ('variants.manage','schedules.manage','products.manage')
          order by r.code,p.code;

          select 'CAPABILITIES';
          select code||'|'||scope||'|'||active
          from public.capabilities
          where code in ('variants.manage','schedules.manage','products.manage')
          order by code;

          select 'LOCAL_CAPABILITY_ROWS';
          select l.name||'|'||c.code||'|'||lc.enabled
          from public.local_capabilities lc
          join public.locals l on l.id=lc.local_id
          join public.capabilities c on c.id=lc.capability_id
          where c.code in ('variants.manage','schedules.manage','products.manage')
          order by l.name,c.code;
          """
          subprocess.run(["psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
            check=True,env=env)
          PY
