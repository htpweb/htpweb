name: Codigo 75 Inspect Address RPC

on:
  push:
    branches: [codigo-75-direcciones-cliente]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Inspect address RPC
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'SAVE_MY_CUSTOMER_ADDRESS_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.proname='save_my_customer_address';

          select 'CURRENT_CUSTOMER_ID_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.proname='current_customer_id';

          select 'ADDRESS_RPC_PRIVS';
          select 'auth='||
            has_function_privilege(
              'authenticated',
              'public.save_my_customer_address(uuid,text,text,text,numeric,numeric,boolean,boolean)',
              'EXECUTE'
            )||
            '|anon='||
            has_function_privilege(
              'anon',
              'public.save_my_customer_address(uuid,text,text,text,numeric,numeric,boolean,boolean)',
              'EXECUTE'
            );

          select 'INDEXES';
          select indexname||'|'||indexdef
          from pg_indexes
          where schemaname='public'
            and tablename='customer_addresses'
          order by indexname;
          """
          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
