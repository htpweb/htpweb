name: Codigo 65 Backend Inspect

on:
  push:
    branches: [codigo-65-locales-ux]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect local requests backend
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          raw=Path("supabase/.temp/pooler-url").read_text().strip()
          p=urlparse(raw)
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]
          sql=r"""
          select 'LOCAL_REQUESTS_COLUMNS';
          select column_name||':'||data_type
          from information_schema.columns
          where table_schema='public' and table_name='local_requests'
          order by ordinal_position;

          select 'LOCAL_REQUESTS_CONSTRAINTS';
          select pg_get_constraintdef(oid)
          from pg_constraint
          where conrelid='public.local_requests'::regclass
          order by conname;

          select 'LOCALS_COLUMNS';
          select column_name||':'||data_type
          from information_schema.columns
          where table_schema='public' and table_name='locals'
          order by ordinal_position;

          select 'SUBMIT_LOCAL_REQUEST_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='submit_local_request';

          select 'MASTER_APPLY_LOCAL_REQUEST_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='master_apply_local_request';
          """
          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
