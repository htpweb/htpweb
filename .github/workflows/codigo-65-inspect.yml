name: Codigo 65 RLS Inspect

on:
  push:
    branches: [codigo-65-locales-ux]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect local discovery policies
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          raw=Path("supabase/.temp/pooler-url").read_text().strip()
          p=urlparse(raw)
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]
          sql=r"""
          select 'LOCALS_POLICIES';
          select policyname||'|'||cmd||'|'||coalesce(qual,'')||'|'||coalesce(with_check,'')
          from pg_policies
          where schemaname='public' and tablename='locals'
          order by policyname;

          select 'LOCAL_DELIVERIES_POLICIES';
          select policyname||'|'||cmd||'|'||coalesce(qual,'')||'|'||coalesce(with_check,'')
          from pg_policies
          where schemaname='public' and tablename='local_deliveries'
          order by policyname;

          select 'LOCALS_NULLABILITY';
          select column_name||'|'||is_nullable
          from information_schema.columns
          where table_schema='public' and table_name='locals'
            and column_name in ('zone_id','name','slug','address','phone','latitude','longitude')
          order by column_name;
          """
          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
