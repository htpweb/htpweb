name: HTPWEB Edge Audit

on:
  push:
    branches: [runtime-edge-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: |
          supabase secrets list --project-ref "$SUPABASE_PROJECT_ID"
