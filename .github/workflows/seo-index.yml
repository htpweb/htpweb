name: HTPWEB SEO Index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "app/tienda.html"
      - "scripts/generate-seo.mjs"
      - ".github/workflows/seo-index.yml"

permissions:
  contents: write

concurrency:
  group: htpweb-seo-index
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate sitemap and LOCAL SEO pages
        run: node scripts/generate-seo.mjs

      - name: Validate generated SEO
        shell: bash
        run: |
          set -euo pipefail
          test -s sitemap.xml
          test -s robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'Sitemap:' robots.txt
          node --check scripts/generate-seo.mjs

      - name: Publish SEO changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No SEO changes to publish."
            exit 0
          fi
          git config user.name "HTPWEB SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml robots.txt .seo-generated-locals.json
          while IFS= read -r slug; do
            [ -n "$slug" ] && git add -- "$slug/index.html"
          done < <(node -e "const m=require('./.seo-generated-locals.json'); for(const s of m.slugs||[]) console.log(s)")
          git add -u
          git commit -m "seo: refresh indexed LOCAL pages"
          git push origin HEAD:main
