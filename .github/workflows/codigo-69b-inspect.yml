name: Codigo 69B Inspect Validator

on:
  push:
    branches: [codigo-69b-tarifas-dia-noche]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect fee validator
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy(); env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]
          sql=r"""
          select 'VALIDATOR_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.proname='validate_delivery_fee_config_state';

          select 'FEE_TRIGGERS';
          select c.relname||'|'||t.tgname||'|'||pg_get_triggerdef(t.oid)
          from pg_trigger t
          join pg_class c on c.oid=t.tgrelid
          join pg_namespace n on n.oid=c.relnamespace
          where n.nspname='public'
            and c.relname in ('delivery_fee_configs','delivery_fee_ranges','delivery_fee_rates')
            and not t.tgisinternal
          order by c.relname,t.tgname;

          select 'POST_MIGRATION_CONFIG';
          select d.name||'|'||c.mode||'|'||c.fixed_fee||'|'||c.day_start_time||'|'||c.night_start_time||'|'||c.active
          from public.delivery_fee_configs c
          join public.deliveries d on d.id=c.delivery_id
          order by d.name;

          select 'POST_MIGRATION_RATE_COUNT|'||count(*)
          from public.delivery_fee_rates;
          """
          subprocess.run(["psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
            check=True,env=env)
          PY
