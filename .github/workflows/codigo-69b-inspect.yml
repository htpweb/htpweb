name: Codigo 69B Inspect Fees

on:
  push:
    branches: [codigo-69b-tarifas-dia-noche]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect fee backend
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy(); env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'CONFIG_COLUMNS';
          select column_name||'|'||data_type||'|'||is_nullable||'|'||coalesce(column_default,'')
          from information_schema.columns
          where table_schema='public' and table_name='delivery_fee_configs'
          order by ordinal_position;

          select 'RANGE_COLUMNS';
          select column_name||'|'||data_type||'|'||is_nullable||'|'||coalesce(column_default,'')
          from information_schema.columns
          where table_schema='public' and table_name='delivery_fee_ranges'
          order by ordinal_position;

          select 'CONFIG_CONSTRAINTS';
          select conname||'|'||pg_get_constraintdef(oid)
          from pg_constraint
          where conrelid='public.delivery_fee_configs'::regclass
          order by conname;

          select 'RANGE_CONSTRAINTS';
          select conname||'|'||pg_get_constraintdef(oid)
          from pg_constraint
          where conrelid='public.delivery_fee_ranges'::regclass
          order by conname;

          select 'CALCULATE_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='calculate_delivery_fee';

          select 'SAVE_CONFIG_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='save_delivery_fee_config';

          select 'SAVE_RANGE_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='save_delivery_fee_range';

          select 'FEE_POLICIES';
          select tablename||'|'||policyname||'|'||cmd||'|'||coalesce(qual,'')||'|'||coalesce(with_check,'')
          from pg_policies
          where schemaname='public' and tablename in ('delivery_fee_configs','delivery_fee_ranges')
          order by tablename,policyname;

          select 'DEMO_CONFIG';
          select d.name||'|'||c.mode||'|'||c.fixed_fee||'|'||c.active
          from public.delivery_fee_configs c
          join public.deliveries d on d.id=c.delivery_id
          order by d.name;

          select 'DEMO_RANGES';
          select d.name||'|'||r.distance_from||'|'||r.distance_to||'|'||r.fee||'|'||r.active
          from public.delivery_fee_ranges r
          join public.deliveries d on d.id=r.delivery_id
          order by d.name,r.distance_from;
          """

          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
