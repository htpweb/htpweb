name: Codigo 68 Deploy and Verify

on:
  push:
    branches: [codigo-68-master-usuarios]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify master user listing
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess
          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy(); env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'FUNCTION_EXISTS|' || (to_regprocedure('public.master_list_users()') is not null);
          select 'AUTH_EXECUTE|' || has_function_privilege('authenticated','public.master_list_users()','EXECUTE');
          select 'ANON_EXECUTE|' || has_function_privilege('anon','public.master_list_users()','EXECUTE');

          do $$
          declare
            v_master uuid;
            v_count integer;
          begin
            select p.id into v_master
            from public.profiles p
            join public.roles r on r.id=p.role_id
            where p.active=true and r.active=true and r.code='MASTER'
            order by p.created_at
            limit 1;

            if v_master is null then
              raise exception 'No active MASTER available for verification';
            end if;

            perform set_config('request.jwt.claim.sub', v_master::text, true);

            select count(*) into v_count
            from public.master_list_users();

            if v_count < 1 then
              raise exception 'master_list_users returned no rows';
            end if;

            raise notice 'MASTER_LIST_USERS_COUNT=%', v_count;
          end
          $$;
          """

          subprocess.run(["psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql],
            check=True,env=env)
          PY
