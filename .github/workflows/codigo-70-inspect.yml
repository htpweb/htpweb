name: Codigo 70 Inspect

on:
  push:
    branches: [codigo-70-zonas-cobertura]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect zones backend
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'ZONE_FUNCTIONS';
          select p.proname||'|'||pg_get_function_identity_arguments(p.oid)
          from pg_proc p
          join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and (p.proname ilike '%zone%' or p.proname ilike '%city%')
          order by p.proname,pg_get_function_identity_arguments(p.oid);

          select 'ZONES_CONSTRAINTS';
          select conname||'|'||pg_get_constraintdef(oid)
          from pg_constraint
          where conrelid='public.zones'::regclass
          order by conname;

          select 'DELIVERY_ZONES_CONSTRAINTS';
          select conname||'|'||pg_get_constraintdef(oid)
          from pg_constraint
          where conrelid='public.delivery_zones'::regclass
          order by conname;

          select 'ZONE_POLICIES';
          select tablename||'|'||policyname||'|'||cmd||'|'||coalesce(qual,'')||'|'||coalesce(with_check,'')
          from pg_policies
          where schemaname='public' and tablename in ('zones','delivery_zones')
          order by tablename,policyname;

          select 'ZONE_PERMISSIONS';
          select r.code||'|'||p.code
          from public.role_permissions rp
          join public.roles r on r.id=rp.role_id
          join public.permissions p on p.id=rp.permission_id
          where p.code ilike '%zone%'
          order by r.code,p.code;

          select 'ZONE_CAPABILITIES';
          select c.code||'|'||c.scope||'|'||c.active
          from public.capabilities c
          where c.code ilike '%zone%'
          order by c.code;

          select 'ZONE_LIMITS';
          select code||'|'||scope||'|'||active
          from public.limits
          where code ilike '%zone%'
          order by code;

          select 'CITIES';
          select id||'|'||name||'|'||coalesce(province,'')||'|'||country||'|'||active
          from public.cities
          order by name;

          select 'ZONES';
          select id||'|'||name||'|'||city_id||'|'||active
          from public.zones
          order by name;

          select 'DELIVERY_ZONES';
          select delivery_id||'|'||zone_id||'|'||active
          from public.delivery_zones
          order by delivery_id,zone_id;

          select 'DELIVERIES';
          select id||'|'||name||'|'||coalesce(city_id::text,'NULL')||'|'||active
          from public.deliveries
          order by name;
          """
          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
