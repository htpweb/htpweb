name: Codigo 70 Deploy and Verify

on:
  push:
    branches: [codigo-70-zonas-cobertura]

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify zones runtime with rollback
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'CONTEXT_FUNCTION_EXISTS|' ||
            (to_regprocedure('public.delivery_zone_context(uuid)') is not null);
          select 'CONTEXT_AUTH_EXECUTE|' ||
            has_function_privilege('authenticated','public.delivery_zone_context(uuid)','EXECUTE');
          select 'CONTEXT_ANON_EXECUTE|' ||
            has_function_privilege('anon','public.delivery_zone_context(uuid)','EXECUTE');

          begin;

          do $$
          declare
            v_master uuid;
            v_delivery uuid;
            v_city_a uuid;
            v_city_b uuid;
            v_zone uuid;
            v_context jsonb;
            v_delivery_change_blocked boolean := false;
            v_zone_change_blocked boolean := false;
            v_zone_disable_blocked boolean := false;
          begin
            select p.id into v_master
            from public.profiles p
            join public.roles r on r.id=p.role_id
            where p.active=true and r.active=true and r.code='MASTER'
            order by p.created_at
            limit 1;

            select d.id into v_delivery
            from public.deliveries d
            where d.active=true
            order by d.created_at
            limit 1;

            if v_master is null or v_delivery is null then
              raise exception 'Missing MASTER or active DELIVERY';
            end if;

            perform set_config('request.jwt.claim.sub', v_master::text, true);

            v_context := public.delivery_zone_context(v_delivery);

            if (v_context->'delivery'->>'id')::uuid <> v_delivery then
              raise exception 'delivery_zone_context returned wrong DELIVERY';
            end if;

            select public.master_save_city(
              null,
              'HTPWEB VERIFY ZONE CITY A',
              'Verificación',
              'Ecuador',
              true
            ) into v_city_a;

            select public.master_save_city(
              null,
              'HTPWEB VERIFY ZONE CITY B',
              'Verificación',
              'Ecuador',
              true
            ) into v_city_b;

            perform public.master_set_delivery_city(v_delivery, v_city_a);

            select public.master_save_zone(
              null,
              v_city_a,
              'HTPWEB VERIFY ZONE',
              true
            ) into v_zone;

            perform public.set_delivery_zone(v_delivery, v_zone, true);

            v_context := public.delivery_zone_context(v_delivery);

            if coalesce((v_context->>'current_zones')::integer,0) <> 1 then
              raise exception 'Context did not report one active zone';
            end if;

            begin
              perform public.master_set_delivery_city(v_delivery, v_city_b);
            exception when others then
              v_delivery_change_blocked := true;
            end;

            begin
              perform public.master_save_zone(
                v_zone,
                v_city_b,
                'HTPWEB VERIFY ZONE',
                true
              );
            exception when others then
              v_zone_change_blocked := true;
            end;

            begin
              perform public.master_save_zone(
                v_zone,
                v_city_a,
                'HTPWEB VERIFY ZONE',
                false
              );
            exception when others then
              v_zone_disable_blocked := true;
            end;

            if not v_delivery_change_blocked
               or not v_zone_change_blocked
               or not v_zone_disable_blocked then
              raise exception 'One or more city-zone integrity guards failed';
            end if;

            raise notice 'ZONE_CONTEXT_OK=true';
            raise notice 'DELIVERY_CITY_GUARD_OK=true';
            raise notice 'ZONE_CITY_GUARD_OK=true';
            raise notice 'ZONE_DISABLE_GUARD_OK=true';
          end
          $$;

          rollback;

          select 'VERIFY_RESIDUE_CITIES|' || count(*)
          from public.cities
          where name in ('HTPWEB VERIFY ZONE CITY A','HTPWEB VERIFY ZONE CITY B');

          select 'VERIFY_RESIDUE_ZONES|' || count(*)
          from public.zones
          where name='HTPWEB VERIFY ZONE';
          """

          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
