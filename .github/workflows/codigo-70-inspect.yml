name: Codigo 70 Inspect Detail

on:
  push:
    branches: [codigo-70-zonas-cobertura]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect zones backend detail
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import os, subprocess

          p=urlparse(Path("supabase/.temp/pooler-url").read_text().strip())
          env=os.environ.copy()
          env["PGPASSWORD"]=os.environ["SUPABASE_DB_PASSWORD"]

          sql=r"""
          select 'MASTER_SAVE_ZONE_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='master_save_zone';

          select 'SET_DELIVERY_ZONE_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='set_delivery_zone';

          select 'MASTER_SET_DELIVERY_CITY_DEF';
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public' and p.proname='master_set_delivery_city';

          select 'LIMIT_TABLES';
          select tablename
          from pg_tables
          where schemaname='public' and tablename ilike '%limit%'
          order by tablename;

          select 'CITIES';
          select id||'|'||name||'|'||coalesce(province,'')||'|'||country||'|'||active
          from public.cities
          order by name;

          select 'ZONES';
          select id||'|'||name||'|'||city_id||'|'||active
          from public.zones
          order by name;

          select 'DELIVERY_ZONES';
          select delivery_id||'|'||zone_id||'|'||active
          from public.delivery_zones
          order by delivery_id,zone_id;

          select 'DELIVERIES';
          select id||'|'||name||'|'||coalesce(city_id::text,'NULL')||'|'||active
          from public.deliveries
          order by name;
          """
          subprocess.run([
            "psql","-h",p.hostname,"-p",str(p.port),"-U",p.username,
            "-d",p.path.lstrip("/").split("?")[0],"-At","-v","ON_ERROR_STOP=1","-c",sql
          ],check=True,env=env)
          PY
