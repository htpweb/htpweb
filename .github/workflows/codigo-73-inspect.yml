name: Codigo 73 Version Edge Source

on:
  push:
    branches: [codigo-73-disponibilidad-local-checkout]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download deployed crear-pedido
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: hwfloywzqlgqieonuswl
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/functions/crear-pedido
          mkdir -p supabase/functions
          supabase functions download crear-pedido --project-ref "$SUPABASE_PROJECT_ID"

          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          p=Path("supabase/functions/crear-pedido/index.ts")
          if not p.exists():
              raise SystemExit("crear-pedido/index.ts was not downloaded")

          text=p.read_text(errors="strict")

          suspicious=[
              r"SUPABASE_SERVICE_ROLE_KEY\s*=\s*['\"][^'\"]+",
              r"ORS_API_KEY\s*=\s*['\"][^'\"]+",
              r"sk_[A-Za-z0-9_-]{20,}",
          ]
          if any(re.search(pattern,text) for pattern in suspicious):
              raise SystemExit("Potential literal secret found; refusing to commit downloaded Edge source")

          print("EDGE_BYTES="+str(len(text.encode())))
          print("EDGE_SHA256="+hashlib.sha256(text.encode()).hexdigest())
          print("HAS_LOCAL_SCHEDULES="+str(bool(re.search(r"local_schedules|opening_time|closing_time",text,re.I))).lower())
          PY

      - name: Commit downloaded source if changed
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/crear-pedido/index.ts
          if git diff --cached --quiet; then
            echo "EDGE_SOURCE_ALREADY_VERSIONED=true"
            exit 0
          fi

          git config user.name "htpweb-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Código #73: versionar crear-pedido desplegada antes de modificar"
          git push origin HEAD:codigo-73-disponibilidad-local-checkout
