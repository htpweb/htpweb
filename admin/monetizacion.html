<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monetización · HTPWEB</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/supabase.js"></script><script src="../config/auth.js"></script><link rel="stylesheet" href="../assets/admin.css"><link rel="stylesheet" href="../assets/monetization.css"></head><body><main class="monetization-shell">
<div class="row between"><div><h1>Planes y monetización</h1><p class="muted">Planes, prestaciones, asignaciones y consumo efectivo por DELIVERY o LOCAL.</p></div><a class="btn-muted back" href="./index.html">Volver al ADMIN</a></div>
<div id="message" class="message hidden"></div>
<section class="card master-only"><h2>Plan</h2><input id="planId" type="hidden"><div class="form-grid"><div><label>Código</label><input id="code" placeholder="DELIVERY_PRO"></div><div><label>Nombre</label><input id="name"></div><div><label>Destino</label><select id="targetType"><option>DELIVERY</option><option>LOCAL</option></select></div><div><label>Precio USD</label><input id="price" type="number" min="0" step=".01" value="0"></div><div><label>Periodicidad</label><select id="interval"><option value="MONTH">Mensual</option><option value="YEAR">Anual</option><option value="ONE_TIME">Pago único</option></select></div><div><label>Orden</label><input id="order" type="number" min="0" value="0"></div></div><label>Descripción</label><textarea id="description"></textarea><label>Prestaciones (una por línea: CAPABILITY|código|true o LIMIT|código|número)</label><textarea id="entitlements" rows="7" placeholder="CAPABILITY|products.manage|true&#10;LIMIT|max_products|100"></textarea><label><input id="active" type="checkbox" checked> Plan activo</label><div class="row"><button class="btn-primary" id="savePlan">Guardar plan</button><button class="btn-muted" id="newPlan">Nuevo</button></div></section>
<section class="card"><h2>Planes disponibles</h2><div id="plans"></div></section>
<section class="card master-only"><h2>Asignar plan</h2><div class="form-grid"><div><label>Plan</label><select id="assignmentPlan"></select></div><div><label>Tipo</label><select id="assignmentType"><option>DELIVERY</option><option>LOCAL</option></select></div><div><label>Destino</label><select id="assignmentTarget"></select></div><div><label>Estado</label><select id="assignmentStatus"><option>ACTIVE</option><option>TRIAL</option><option>PAST_DUE</option></select></div><div><label>Finaliza</label><input id="endsAt" type="datetime-local"></div><div><label>Fin de prueba</label><input id="trialEndsAt" type="datetime-local"></div></div><button class="btn-primary" id="assignPlan">Asignar</button></section>
<section class="card"><h2>Consumo y límites efectivos</h2><div class="form-grid"><div><label>Tipo</label><select id="usageType"><option>DELIVERY</option><option>LOCAL</option></select></div><div><label>Destino</label><select id="usageTarget"></select></div></div><button class="btn-muted" id="loadUsage">Consultar</button><pre id="usage">Selecciona un destino.</pre></section>
<section class="card master-only"><h2>Excepción MASTER</h2><div class="form-grid"><div><label>Tipo</label><select id="overrideType"><option>CAPABILITY</option><option>LIMIT</option></select></div><div><label>Código</label><input id="overrideCode"></div><div><label>Valor</label><input id="overrideValue"></div><div><label>Motivo</label><input id="overrideReason"></div></div><button class="btn-muted" id="saveOverride">Guardar excepción</button></section>
</main><script src="./monetization.js"></script></body></html>
