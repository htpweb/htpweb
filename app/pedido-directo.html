<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedido directo | HTPWEB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script><script src="../config/auth.js"></script>
<link rel="stylesheet" href="../assets/app.css?v=20261003-platform2">
<style>.shell{max-width:820px;margin:auto;padding:20px 14px 50px}.line{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-top:1px solid #eef2f7}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:.82rem}.total{font-size:1.35rem;font-weight:800}</style>
<script src="../config/business-domain.js?v=20261007-business1"></script>
<script src="../assets/business-terminology.js?v=20261007-business1"></script>
</head><body><main class="shell">
<div class="row between"><div><h1>Pedido directo</h1><p class="muted">Pedido gestionado por el LOCAL mediante HTPWEB.</p></div><a class="btn btn-muted" href="mi-cuenta.html#orders">← Mis pedidos</a></div>
<div id="message" class="hidden"></div><section id="detail" class="card"><div class="muted">Cargando pedido…</div></section>
</main><script>
const $=id=>document.getElementById(id),orderId=new URLSearchParams(location.search).get("order")||"";
const GUEST_ORDER_TRACKING_KEY="HTPWEB_GUEST_ORDER_TRACKING_V1";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=v=>"$"+Number(v||0).toFixed(2),statusNames={PENDING:"Pendiente",CONFIRMED:"Confirmado",PREPARING:"En preparación",READY:"Listo",EN_ROUTE:"En camino",DELIVERED:"Entregado",CANCELLED:"Cancelado"};
function error(text){$("message").textContent=text;$("message").className="error"}
async function claimPendingGuestOrder(){
 let pending=null;
 try{pending=JSON.parse(sessionStorage.getItem(GUEST_ORDER_TRACKING_KEY)||"null")}catch{}
 if(!pending?.order_id||pending.order_id!==orderId||pending.channel!=="DIRECT_LOCAL"||!pending.phone)return;
 const claim=await supabaseClient.rpc("claim_my_guest_order",{p_order_id:orderId,p_phone:pending.phone});
 if(claim.error)throw claim.error;
 if(claim.data===true)sessionStorage.removeItem(GUEST_ORDER_TRACKING_KEY);
}
async function init(){
 const user=await obtenerUsuarioActual();if(!user){irAAcceso("pedido-directo.html?order="+encodeURIComponent(orderId));return}
 if(!orderId)throw new Error("Pedido no especificado.");
 await claimPendingGuestOrder();
 const o=await supabaseClient.from("orders").select("id,origin_local_id,order_channel,fulfillment_method,status,subtotal,delivery_fee,total,customer_name,customer_phone,delivery_address,notes,created_at").eq("id",orderId).eq("order_channel","DIRECT_LOCAL").maybeSingle();
 if(o.error)throw o.error;if(!o.data)throw new Error("Este pedido no está disponible en tu cuenta.");
 const [l,it]=await Promise.all([supabaseClient.from("locals").select("id,name,slug,whatsapp").eq("id",o.data.origin_local_id).maybeSingle(),supabaseClient.from("order_items").select("id,product_name,variant_name,promotion_title,unit_price,quantity,subtotal").eq("order_id",orderId).order("created_at")]);
 if(l.error)throw l.error;if(it.error)throw it.error;render(o.data,l.data,it.data||[]);
}

function render(o,l,items){
 const fulfillment=o.fulfillment_method==="PICKUP"?"Retiro en LOCAL":"Entrega propia del LOCAL";
 $("detail").innerHTML='<div class="row between"><div><div class="muted">'+esc(l?.name||"LOCAL")+'</div><h2 style="margin:3px 0">Pedido #'+esc(String(o.id).slice(0,8).toUpperCase())+'</h2></div><span class="pill">'+esc(statusNames[o.status]||o.status)+'</span></div>'+
 '<p class="muted">'+esc(new Date(o.created_at).toLocaleString("es-EC",{timeZone:"America/Guayaquil"}))+'</p><p><strong>Canal:</strong> Compra directa · '+esc(fulfillment)+'</p>'+
 (o.delivery_address?'<p><strong>Dirección:</strong> '+esc(o.delivery_address)+'</p>':'')+(o.notes?'<p><strong>Observaciones:</strong> '+esc(o.notes)+'</p>':'')+
 '<h3>Productos</h3>'+items.map(i=>'<div class="line"><div><strong>'+esc(i.product_name)+'</strong>'+(i.variant_name?'<div class="muted">'+esc(i.variant_name)+'</div>':'')+(i.promotion_title?'<div class="muted">Promoción: '+esc(i.promotion_title)+'</div>':'')+'<div class="muted">'+esc(i.quantity)+' × '+money(i.unit_price)+'</div></div><strong>'+money(i.subtotal)+'</strong></div>').join("")+
 '<div class="line total"><span>Total</span><span>'+money(o.total)+'</span></div>'+
 (l?.slug?'<div class="row" style="margin-top:14px"><a class="btn btn-primary" href="tienda.html?local='+encodeURIComponent(l.slug)+'&src=htpweb">Comprar nuevamente</a></div>':'');
}
init().catch(e=>{console.error(e);error(e.message||"No se pudo cargar el pedido.");$("detail").innerHTML=""});
</script></body></html>
