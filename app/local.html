```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:14px 16px;text-align:center}
nav{display:flex;gap:8px;margin-bottom:15px}
nav button{flex:1}
main{max-width:700px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.banner{width:100%;height:220px;object-fit:cover;border-radius:10px}
h2,h3{margin-top:0}
.producto{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
.producto:last-child{border-bottom:0}
.producto img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#eee}
.info{flex:1}
.precio{font-weight:bold;font-size:18px;margin:8px 0}
.descripcion{font-size:14px;color:#666}
button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:bold}
.btn{background:#111;color:#fff}
.btn-sec{background:#eee}
.btn-carrito{width:100%;padding:13px;margin-top:15px}
.cantidad{display:flex;align-items:center;gap:8px;margin-top:8px}
.cantidad button{background:#eee}
.cantidad button:disabled{opacity:.4}
.vacio{text-align:center;padding:30px;color:#666}
#carritoBar{position:sticky;bottom:15px;z-index:10}
#btnCarrito{display:none;width:100%}
</style>
</head>

<body>

<header>
<h2 id="nombreNegocio">Cargando...</h2>
<div id="nombreLocal"></div>
</header>

<main>

<nav>
<button class="btn-sec" id="volverLocales">← Ver locales</button>
<button class="btn-sec" id="irCarrito">🛒 Mi pedido</button>
</nav>

<section class="card" id="contenido"></section>

<div id="carritoBar">
<button class="btn btn-carrito" id="btnCarrito">Ver mi pedido</button>
</div>

</main>

<script>
const $=id=>document.getElementById(id);

let negocioActual=null;
let local=null;
let productos=[];
let pedidoId=null;
let procesando=false;

const cantidades={};

const params=new URLSearchParams(location.search);
const localId=params.get("id");
const clienteSlug=params.get("cliente");

function claveCarrito(){
return clienteSlug?`htpweb_pedido_${clienteSlug}`:"htpweb_pedido";
}

function obtenerPedido(){

try{

return sessionStorage.getItem(claveCarrito())||null;

}catch(e){

console.warn("No se pudo acceder a sessionStorage.",e);
return null;

}

}

function guardarPedido(id){

try{

sessionStorage.setItem(claveCarrito(),id);

}catch(e){

console.warn("No se pudo guardar el pedido en sessionStorage.",e);

}

}

async function iniciar(){

if(!localId){

$("contenido").innerHTML=
'<div class="vacio">No se especificó el local.</div>';

return;

}

try{

negocio=await cargarNegocio();
negocioActual=negocio;

$("nombreNegocio").textContent=negocio.nombre;

pedidoId=obtenerPedido();

await cargarLocal();
await cargarProductos();

if(pedidoId){
await cargarItemsPedido();
}

actualizarNavegacion();

}catch(e){

console.error(e);

$("contenido").innerHTML=
'<div class="vacio">No se pudo cargar el local.</div>';

}

}

async function cargarLocal(){

const{data,error}=await supabaseClient
.from("locales")
.select("id,nombre,categoria,descripcion,banner_url")
.eq("id",localId)
.eq("cliente_id",negocioActual.id)
.eq("activo",true)
.single();

if(error||!data)throw new Error("Local no encontrado.");

local=data;

$("nombreLocal").textContent=local.nombre;

$("contenido").innerHTML=`
${local.banner_url
?`<img class="banner" src="${escapeHtml(local.banner_url)}" alt="${escapeHtml(local.nombre)}">`
:""}

<h2>${escapeHtml(local.nombre)}</h2>

${local.descripcion
?`<p class="descripcion">${escapeHtml(local.descripcion)}</p>`
:""}

<div id="productos">
<div class="vacio">Cargando productos...</div>
</div>`;

}

async function cargarProductos(){

const{data,error}=await supabaseClient
.from("productos")
.select("id,nombre,descripcion,precio,imagen_url,activo")
.eq("cliente_id",negocioActual.id)
.eq("local_id",local.id)
.eq("activo",true)
.order("nombre");

if(error)throw error;

productos=data||[];

renderProductos();

}

async function cargarItemsPedido(){

const{data,error}=await supabaseClient.rpc(
"obtener_carrito",
{p_pedido_id:pedidoId}
);

if(error)throw error;

Object.keys(cantidades).forEach(k=>delete cantidades[k]);

(data||[]).forEach(item=>{

if(item.local_id===local.id){
cantidades[item.producto_id]=Number(item.cantidad);
}

});

renderProductos();

}

function renderProductos(){

if(!productos.length){

$("productos").innerHTML=
'<div class="vacio">Este local no tiene productos disponibles.</div>';

return;

}

$("productos").innerHTML=productos.map(p=>{

const cantidad=cantidades[p.id]||0;

return`

<div class="producto">

${p.imagen_url
?`<img src="${escapeHtml(p.imagen_url)}" alt="${escapeHtml(p.nombre)}">`
:""}

<div class="info">

<strong>${escapeHtml(p.nombre)}</strong>

${p.descripcion
?`<div class="descripcion">${escapeHtml(p.descripcion)}</div>`
:""}

<div class="precio">
$${Number(p.precio).toFixed(2)}
</div>

<div class="cantidad">

<button
onclick="cambiarCantidad('${p.id}',${cantidad-1})"
${cantidad<=0?"disabled":""}>
−
</button>

<strong>${cantidad}</strong>

<button
onclick="cambiarCantidad('${p.id}',${cantidad+1})">
+
</button>

</div>

</div>
</div>`;

}).join("");

}

async function cambiarCantidad(productoId,nuevaCantidad){

if(procesando||nuevaCantidad<0)return;

const anterior=cantidades[productoId]||0;

if(nuevaCantidad===anterior)return;

cantidades[productoId]=nuevaCantidad;

renderProductos();

procesando=true;

try{

await asegurarCarrito();

const diferencia=nuevaCantidad-anterior;

if(diferencia>0){

const{error}=await supabaseClient.rpc(
"agregar_al_carrito",
{
p_pedido_id:pedidoId,
p_producto_id:productoId,
p_cantidad:diferencia
}
);

if(error)throw error;

}else{

const{data,error}=await supabaseClient.rpc(
"obtener_carrito",
{p_pedido_id:pedidoId}
);

if(error)throw error;

const item=(data||[]).find(
x=>x.producto_id===productoId
);

if(!item)return;

const cantidadFinal=
Number(item.cantidad)+diferencia;

if(cantidadFinal<=0){

const{error:e}=await supabaseClient.rpc(
"eliminar_del_carrito",
{p_detalle_id:item.detalle_id}
);

if(e)throw e;

}else{

const{error:e}=await supabaseClient.rpc(
"actualizar_cantidad_carrito",
{
p_detalle_id:item.detalle_id,
p_cantidad:cantidadFinal
}
);

if(e)throw e;

}

}

actualizarNavegacion();

}catch(e){

console.error(e);

cantidades[productoId]=anterior;

renderProductos();

alert(e.message||"No se pudo actualizar el pedido.");

}finally{

procesando=false;

}

}

async function asegurarCarrito(){

if(pedidoId)return;

const{data,error}=await supabaseClient.rpc(
"crear_carrito",
{p_cliente_id:negocioActual.id}
);

if(error)throw error;

pedidoId=data;

guardarPedido(pedidoId);

actualizarNavegacion();

}

function actualizarNavegacion(){

$("volverLocales").onclick=()=>{

location.href=
`index.html?cliente=${encodeURIComponent(negocioActual.slug)}`;

};

$("irCarrito").onclick=()=>{

location.href=
`carrito.html?cliente=${encodeURIComponent(negocioActual.slug)}`;

};

if(pedidoId){

$("btnCarrito").style.display="block";

$("btnCarrito").onclick=()=>{

location.href=
`carrito.html?cliente=${encodeURIComponent(negocioActual.slug)}`;

};

}else{

$("btnCarrito").style.display="none";

}

}

function escapeHtml(text){

return String(text??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

iniciar();
</script>

</body>
</html>
```
