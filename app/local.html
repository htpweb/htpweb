<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local</title>
<script src="../config/theme-bootstrap.js?v=20261002-theme3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js?v=20261002-theme3"></script>
<script src="../config/cart.js"></script>
<script src="../config/ads.js?v=20261002-mobile1"></script>
<link rel="stylesheet" href="../assets/app.css?v=20261002-closed1">
</head>
<body>
<header>
  <div class="header-row">
    <div class="delivery-brand-shell">
      <div class="delivery-brand-logo-frame">
        <img id="deliveryLogo" class="delivery-brand-logo hidden" alt="">
        <span id="deliveryLogoFallback" class="delivery-brand-fallback">D</span>
      </div>
      <div class="delivery-brand-copy">
        <div class="brand" id="brand">DELIVERY</div>
        <div class="delivery-platform-signature" id="platformBrand">by HTPWEB</div>
        <small id="localName"></small>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-light" id="backBtn">← Locales</button>
      <button class="btn btn-primary" id="cartBtn">🛒 <span id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main>
  <section id="localCard" class="card"></section>
  <div id="localOrderStatusNotice" class="local-order-status-notice hidden" role="status"></div>
  <section id="promotionsCard" class="card hidden">
    <h2>Promociones</h2>
    <div id="promotionsListPublic" class="promotions-grid"></div>
  </section>
  <section class="card">
    <h2>Productos</h2>
    <div id="products"></div>
  </section>
  <div id="error" class="error hidden"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[ch]));

const params = new URLSearchParams(location.search);
const localId = params.get("local") || params.get("id");
const sharedProductId = params.get("product") || "";

let negocioActual = null;
let localActual = null;
let availability = null;
let products = [];
let variants = [];

async function init() {
  try {
    if (!localId) throw new Error("No se especificó el local.");

    negocioActual = await cargarNegocio();
    htpApplyDeliveryBrand(negocioActual);
    $("backBtn").onclick = () => location.href = urlDelivery("index.html");
    $("cartBtn").onclick = () => location.href = urlDelivery("carrito.html");
    updateCartCount();

    const { data: relation, error: relError } = await supabaseClient
      .from("local_deliveries")
      .select("local_id")
      .eq("delivery_id", negocioActual.id)
      .eq("local_id", localId)
      .eq("active", true)
      .maybeSingle();

    if (relError) throw relError;
    if (!relation) throw new Error("Este local no está disponible en el delivery seleccionado.");

    const localRes = await supabaseClient
      .from("locals")
      .select("id,name,description,banner_url,logo_url,address,phone,whatsapp,active")
      .eq("id", localId)
      .eq("active", true)
      .single();

    if (localRes.error || !localRes.data) throw new Error("Local no encontrado.");
    localActual = localRes.data;
    document.title = localActual.name + " | " + negocioActual.name;

    try {
      const { data: availabilityData, error: availabilityError } = await supabaseClient.rpc(
        "public_locals_order_availability",
        { p_local_ids: [localId] }
      );

      if (availabilityError) throw availabilityError;
      availability = Array.isArray(availabilityData) ? availabilityData[0] || null : null;
    } catch (availabilityError) {
      console.warn("No se pudo cargar la disponibilidad del local:", availabilityError);
      availability = null;
    }

    const productRes = await supabaseClient
      .from("products")
      .select("id,local_id,category_id,name,description,price,image_url,display_order,active,catalog_visible")
      .eq("local_id", localId)
      .eq("active", true)
      .eq("catalog_visible", true)
      .order("display_order")
      .order("name");

    if (productRes.error) throw productRes.error;
    products = productRes.data || [];

    if (products.length) {
      const variantRes = await supabaseClient
        .from("product_variants")
        .select("id,product_id,name,price,display_order,active")
        .in("product_id", products.map(p => p.id))
        .eq("active", true)
        .order("display_order")
        .order("name");

      if (variantRes.error) throw variantRes.error;
      variants = variantRes.data || [];
    }

    render();
    window.dispatchEvent(new CustomEvent("htpweb:local-ready"));

    if (sharedProductId) {
      requestAnimationFrame(() => {
        const target = document.getElementById("product-" + sharedProductId);

        if (target) {
          target.classList.add("shared-product-target");
          target.scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          $("error").textContent = "El producto compartido ya no está disponible en este LOCAL.";
          $("error").classList.remove("hidden");
        }
      });
    }
  } catch (error) {
    console.error(error);
    $("error").textContent = error.message || "No se pudo cargar el local.";
    $("error").classList.remove("hidden");
  }
}

function availabilityMessage() {
  if (!availability) return null;

  if (availability.is_open === true) {
    if (availability.reason === "NO_SCHEDULE_CONFIGURED") {
      return {
        text: "Disponible para pedidos",
        className: "availability-open"
      };
    }

    return {
      text: availability.closing_time
        ? `Abierto ahora · cierra a las ${availability.closing_time}`
        : "Abierto ahora",
      className: "availability-open"
    };
  }

  if (availability.reason === "BEFORE_OPENING" && availability.opening_time) {
    return {
      text: `Cerrado ahora · abre a las ${availability.opening_time}`,
      className: "availability-closed"
    };
  }

  if (availability.reason === "CLOSED_TODAY") {
    return {
      text: "Cerrado hoy",
      className: "availability-closed"
    };
  }

  if (availability.reason === "AFTER_CLOSING") {
    return {
      text: "Cerrado por hoy",
      className: "availability-closed"
    };
  }

  return {
    text: "No disponible para pedidos en este momento",
    className: "availability-closed"
  };
}

function render() {
  document.title = `${localActual.name} | ${negocioActual.name}`;
  $("localName").textContent = localActual.name;

  const currentAvailability = availabilityMessage();

  $("localCard").innerHTML = `
    ${localActual.banner_url ? `<img src="${esc(localActual.banner_url)}" alt="${esc(localActual.name)}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px">` : ""}
    <div class="row between" style="margin-top:12px">
      <h1 style="margin:0">${esc(localActual.name)}</h1>
      ${currentAvailability ? `<span class="availability-badge ${currentAvailability.className}">${availability?.is_open === true ? "DISPONIBLE" : "CERRADO"}</span>` : ""}
    </div>
    <p class="muted">${esc(localActual.description || "")}</p>
    ${localActual.address ? `<p><strong>Dirección:</strong> ${esc(localActual.address)}</p>` : ""}
    ${currentAvailability ? `<p class="local-availability-detail ${currentAvailability.className}">${esc(currentAvailability.text)}</p>` : ""}
  `;

  const orderNotice = $("localOrderStatusNotice");
  if (orderNotice) {
    const closed = availability && availability.is_open !== true;
    orderNotice.classList.toggle("hidden", !closed);
    orderNotice.textContent = closed
      ? "Este local está CERRADO en este momento. Puedes consultar el menú y los precios, pero no agregar productos hasta que vuelva a estar disponible."
      : "";
  }

  $("products").innerHTML = products.length ? products.map(product => {
    const vs = variants.filter(v => v.product_id === product.id);
    const minPrice = vs.length ? Math.min(...vs.map(v => Number(v.price))) : Number(product.price || 0);

    return `
      <div class="product-row" id="product-${product.id}">
        <div>${product.image_url ? `<img src="${esc(product.image_url)}" alt="${esc(product.name)}">` : ""}</div>
        <div>
          <strong>${esc(product.name)}</strong>
          <div class="muted">${esc(product.description || "")}</div>
          <div class="price" id="price-${product.id}">$ ${minPrice.toFixed(2)}</div>

          ${vs.length ? `
            <label>Variante</label>
            <select id="variant-${product.id}" onchange="syncVariantPrice('${product.id}')">
              ${vs.map(v => `<option value="${v.id}" data-price="${Number(v.price)}">${esc(v.name)} — $${Number(v.price).toFixed(2)}</option>`).join("")}
            </select>
          ` : ""}

          <div class="row product-buy-row">
            ${availability && availability.is_open !== true ? `
              <div class="closed-order-control" aria-label="Disponible cuando abra">
                <span class="closed-order-lock" aria-hidden="true">🔒</span>
                <span>Disponible cuando abra</span>
              </div>
            ` : `
              <div class="quantity-stepper" aria-label="Cantidad en carrito">
                <button
                  type="button"
                  class="qty-step-btn"
                  aria-label="Disminuir cantidad"
                  onclick="event.stopPropagation(); changeProductQuantity('${product.id}', -1)"
                >−</button>
                <input id="qty-${product.id}" type="number" min="0" step="1" value="${cartQuantityForProduct(product.id, vs[0]?.id || null)}" aria-label="Cantidad en carrito" oninput="event.stopPropagation(); setProductQuantity('${product.id}', this.value)">
                <button
                  type="button"
                  class="qty-step-btn"
                  aria-label="Aumentar cantidad"
                  onclick="event.stopPropagation(); changeProductQuantity('${product.id}', 1)"
                >+</button>
              </div>
              <button
                class="btn btn-primary"
                onclick="event.stopPropagation(); addProduct('${product.id}')"
              >Agregar</button>
            `}
          </div>
        </div>
      </div>
    `;
  }).join("") : '<div class="empty">Este local todavía no tiene productos disponibles.</div>';
}

function productCartMatcher(productId, explicitVariantId = undefined) {
  const select = document.getElementById("variant-" + productId);
  const variantId = explicitVariantId !== undefined
    ? (explicitVariantId || null)
    : (select?.value || null);

  return {
    local_id: localActual?.id || "",
    product_id: productId,
    variant_id: variantId
  };
}

function cartQuantityForProduct(productId, variantId = undefined) {
  if (!negocioActual?.slug || !localActual?.id || typeof carritoCantidadItem !== "function") return 0;
  return carritoCantidadItem(negocioActual.slug, productCartMatcher(productId, variantId));
}

function syncProductCartQuantity(productId) {
  const input = $("qty-" + productId);
  if (!input) return 0;
  const total = cartQuantityForProduct(productId);
  input.value = total;
  return total;
}

function syncAllProductCartQuantities() {
  products.forEach(product => syncProductCartQuantity(product.id));
}

function syncVariantPrice(productId) {
  const select = document.getElementById("variant-" + productId);
  if (select) {
    const option = select.selectedOptions[0];
    $("price-" + productId).textContent = "$ " + Number(option.dataset.price || 0).toFixed(2);
  }
  syncProductCartQuantity(productId);
}

function resolveProductVariant(productId, explicitVariantId = undefined) {
  const variantId = explicitVariantId !== undefined
    ? (explicitVariantId || null)
    : (document.getElementById("variant-" + productId)?.value || null);

  return variantId
    ? variants.find(v => v.id === variantId && v.product_id === productId) || null
    : null;
}

function addProductUnit(productId, explicitVariantId = undefined) {
  const product = products.find(p => p.id === productId);
  if (!product) return 0;

  if (availability && availability.is_open !== true) {
    const info = availabilityMessage();
    $("error").textContent = info?.text || "Este local no está disponible para pedidos en este momento.";
    $("error").classList.remove("hidden");
    return cartQuantityForProduct(productId, explicitVariantId ?? null);
  }

  $("error").classList.add("hidden");

  const variant = resolveProductVariant(productId, explicitVariantId);

  carritoAgregar(negocioActual.slug, {
    local_id: localActual.id,
    product_id: product.id,
    variant_id: variant?.id || null,
    snapshot: {
      local_name: localActual.name,
      product_name: product.name,
      variant_name: variant?.name || null
    }
  }, 1);

  updateCartCount();
  syncProductCartQuantity(productId);

  return carritoCantidadItem(
    negocioActual.slug,
    productCartMatcher(productId, variant?.id || null)
  );
}

function changeProductQuantity(productId, delta, explicitVariantId = undefined) {
  const variant = resolveProductVariant(productId, explicitVariantId);
  const matcher = productCartMatcher(productId, variant?.id || null);
  const current = carritoCantidadItem(negocioActual.slug, matcher);

  if (Number(delta) > 0) {
    return addProductUnit(productId, variant?.id || null);
  }

  if (current <= 0) {
    syncProductCartQuantity(productId);
    return 0;
  }

  const next = Math.max(0, current - 1);
  if (next === 0) carritoEliminar(negocioActual.slug, matcher);
  else carritoCambiarCantidad(negocioActual.slug, matcher, next);

  updateCartCount();
  syncProductCartQuantity(productId);
  return next;
}

function setProductQuantity(productId, quantity, explicitVariantId = undefined) {
  const product = products.find(p => p.id === productId);
  if (!product) return 0;

  const parsedQuantity = Number.parseInt(quantity, 10);
  if (!Number.isFinite(parsedQuantity) || parsedQuantity < 0) {
    return syncProductCartQuantity(productId);
  }

  const variant = resolveProductVariant(productId, explicitVariantId);
  const matcher = productCartMatcher(productId, variant?.id || null);
  const current = carritoCantidadItem(negocioActual.slug, matcher);
  const next = Math.max(0, parsedQuantity);

  if (next === current) {
    syncProductCartQuantity(productId);
    return next;
  }

  if (next === 0) {
    carritoEliminar(negocioActual.slug, matcher);
  } else if (current <= 0) {
    carritoAgregar(negocioActual.slug, {
      local_id: localActual.id,
      product_id: product.id,
      variant_id: variant?.id || null,
      snapshot: {
        local_name: localActual.name,
        product_name: product.name,
        variant_name: variant?.name || null
      }
    }, next);
  } else {
    carritoCambiarCantidad(negocioActual.slug, matcher, next);
  }

  updateCartCount();
  syncProductCartQuantity(productId);
  return next;
}

function addProduct(productId) {
  return addProductUnit(productId);
}

window.htpwebAddProductUnit = addProductUnit;
window.htpwebChangeProductQuantity = changeProductQuantity;
window.htpwebSetProductQuantity = setProductQuantity;
window.htpwebProductCartMatcher = productCartMatcher;
window.syncVariantPrice = syncVariantPrice;

function updateCartCount() {
  if (!negocioActual) return;
  $("cartCount").textContent = carritoCantidad(negocioActual.slug);
}

window.addEventListener("htpweb:cart", () => {
  updateCartCount();
  syncAllProductCartQuantities();
});
init();
</script>
<script src="../config/media-viewer.js?v=202609271312"></script>
<script src="../config/menu-viewer.js?v=20261002-closed1"></script>
<script src="../config/promotions.js?v=20261002-promo-filter1"></script>
</body>
</html>
