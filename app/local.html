<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local</title>
<script src="../config/theme-bootstrap.js?v=20261002-theme3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/auth.js?v=20261004-profiles2"></script>
<script src="../config/delivery-context.js?v=20261002-theme3"></script>
<script src="../config/cart.js"></script>
<script src="../config/compact-menu.js?v=20261007-compact1"></script>
<script src="../config/ads.js?v=20261002-mobile1"></script>
<link rel="stylesheet" href="../assets/app.css?v=20261002-stickyanchor1">
<link rel="stylesheet" href="../assets/compact-menu.css?v=20261007-compact1">
<script src="../config/business-domain.js?v=20261007-business1"></script>
<script src="../assets/business-terminology.js?v=20261007-business1"></script>
</head>
<body>
<header>
  <div class="header-row">
    <div class="delivery-brand-shell">
      <div class="delivery-brand-logo-frame">
        <img id="deliveryLogo" class="delivery-brand-logo hidden" alt="">
        <span id="deliveryLogoFallback" class="delivery-brand-fallback">D</span>
      </div>
      <div class="delivery-brand-copy">
        <div class="brand" id="brand">DELIVERY</div>
        <div class="delivery-platform-signature" id="platformBrand">by HTPWEB</div>
        <small id="localName"></small>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-light" id="backBtn">← Locales</button>
      <button class="btn btn-primary" id="cartBtn">🛒 <span id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main>
  <section id="compactMenuMount" class="hidden" aria-label="Menú compacto"></section>
  <section id="localCard" class="card"></section>
  <div id="localOrderStatusNotice" class="local-order-status-notice hidden" role="status"></div>
  <section id="promotionsCard" class="card hidden">
    <h2>Promociones</h2>
    <div id="promotionsListPublic" class="promotions-grid"></div>
  </section>
  <section id="productsCard" class="card">
    <h2>Productos</h2>
    <div id="products"></div>
  </section>
  <div id="error" class="error hidden"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[ch]));

const params = new URLSearchParams(location.search);
const businessId = params.get("business") || params.get("local") || params.get("id");
const sharedProductId = params.get("product") || "";
const menuPreview = (params.get("menu_preview") || "").toUpperCase();

let negocioActual = null;
let businessActual = null;
let viewerUser = null;
let availability = null;
let claimState = null;
let products = [];
let variants = [];
let categories = [];
let inventory = [];
let compactMenuController = null;

async function init() {
  try {
    if (!businessId) throw new Error("No se especificó el negocio.");

    negocioActual = await cargarNegocio();
    viewerUser = await obtenerUsuarioActual();
    htpApplyDeliveryBrand(negocioActual);
    $("backBtn").onclick = () => location.href = urlDelivery("index.html");
    $("cartBtn").onclick = () => location.href = urlDelivery("carrito.html");
    updateCartCount();

    const { data: relation, error: relError } = await supabaseClient
      .from("business_deliveries")
      .select("business_id")
      .eq("delivery_id", negocioActual.id)
      .eq("business_id", businessId)
      .eq("active", true)
      .maybeSingle();

    if (relError) throw relError;
    if (!relation) throw new Error("Este negocio no está disponible en el delivery seleccionado.");

    const businessRes = await supabaseClient
      .from("businesses")
      .select("id,name,description,banner_url,logo_url,address,phone,whatsapp,active,menu_design")
      .eq("id", businessId)
      .eq("active", true)
      .single();

    if (businessRes.error || !businessRes.data) throw new Error("Negocio no encontrado.");
    businessActual = businessRes.data;
    document.title = businessActual.name + " | " + negocioActual.name;

    try {
      const { data: claimData, error: claimError } = await supabaseClient.rpc(
        "public_local_claim_state",
        { p_local_id: businessId }
      );
      if (claimError) throw claimError;
      claimState = claimData || null;
    } catch (claimError) {
      console.warn("No se pudo cargar el estado de reclamación del negocio:", claimError);
      claimState = null;
    }

    try {
      const { data: availabilityData, error: availabilityError } = await supabaseClient.rpc(
        "public_locals_order_availability",
        { p_local_ids: [businessId] }
      );

      if (availabilityError) throw availabilityError;
      availability = Array.isArray(availabilityData) ? availabilityData[0] || null : null;
    } catch (availabilityError) {
      console.warn("No se pudo cargar la disponibilidad del negocio:", availabilityError);
      availability = null;
    }

    const productRes = await supabaseClient
      .from("business_products")
      .select("id,business_id,category_id,name,description,short_description,price,image_url,featured,display_order,active,catalog_visible")
      .eq("business_id", businessId)
      .eq("active", true)
      .eq("catalog_visible", true)
      .order("display_order")
      .order("name");

    if (productRes.error) throw productRes.error;
    products = productRes.data || [];

    if (products.length) {
      const variantRes = await supabaseClient
        .from("product_variants")
        .select("id,product_id,name,price,display_order,active")
        .in("product_id", products.map(p => p.id))
        .eq("active", true)
        .order("display_order")
        .order("name");

      if (variantRes.error) throw variantRes.error;
      variants = variantRes.data || [];
    }

    const [categoryRes, inventoryRes] = await Promise.all([
      supabaseClient.from("business_categories")
        .select("id,business_id,name,display_order,active")
        .eq("business_id", businessId)
        .eq("active", true)
        .order("display_order")
        .order("name"),
      supabaseClient.rpc("public_local_inventory", { p_local_id: businessId })
    ]);
    if (categoryRes.error) throw categoryRes.error;
    categories = categoryRes.data || [];
    inventory = Array.isArray(inventoryRes.data) ? inventoryRes.data : [];

    render();
    applyCompactMenuIfNeeded();
    window.dispatchEvent(new CustomEvent("htpweb:local-ready"));

    if (sharedProductId) {
      requestAnimationFrame(() => {
        const target = document.getElementById("product-" + sharedProductId);

        if (target) {
          target.classList.add("shared-product-target");
          target.scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          $("error").textContent = "El producto compartido ya no está disponible en este negocio.";
          $("error").classList.remove("hidden");
        }
      });
    }
  } catch (error) {
    console.error(error);
    $("error").textContent = error.message || "No se pudo cargar el negocio.";
    $("error").classList.remove("hidden");
  }
}

function compactCartSummary() {
  if (!negocioActual?.slug || !businessActual?.id) return { count: 0, subtotal: 0 };
  const rows = carritoObtener(negocioActual.slug).filter(item => String(item.local_id) === String(businessActual.id) && !item.promotion_id);
  let count = 0;
  let subtotal = 0;
  rows.forEach(item => {
    const product = products.find(p => String(p.id) === String(item.product_id));
    if (!product) return;
    const variant = item.variant_id ? variants.find(v => String(v.id) === String(item.variant_id)) : null;
    const qty = Number(item.quantity || 0);
    count += qty;
    subtotal += qty * Number(variant?.price ?? product.price ?? 0);
  });
  return { count, subtotal };
}

function applyCompactMenuIfNeeded() {
  const previewCompact = menuPreview === "COMPACT";
  const compactActive = previewCompact || String(businessActual?.menu_design || "CURRENT").toUpperCase() === "COMPACT";
  const root = $("compactMenuMount");
  if (!root) return;

  if (!compactActive) {
    root.classList.add("hidden");
    return;
  }

  $("localCard")?.classList.add("hidden");
  $("localOrderStatusNotice")?.classList.add("hidden");
  $("promotionsCard")?.classList.add("hidden");
  $("productsCard")?.classList.add("hidden");
  root.classList.remove("hidden");

  if (compactMenuController?.destroy) compactMenuController.destroy();
  compactMenuController = window.HTPWEBCompactMenu?.mount({
    root,
    local: businessActual,
    products,
    variants,
    categories,
    inventory,
    availability,
    preview: previewCompact,
    cart: {
      canOrder: availability?.is_open !== false,
      getQuantity(product, variant) {
        return cartQuantityForProduct(product.id, variant?.id || null);
      },
      changeQuantity(product, variant, delta) {
        return changeProductQuantity(product.id, delta, variant?.id || null);
      },
      getSummary: compactCartSummary,
      onViewCart() {
        location.href = urlDelivery("carrito.html");
      }
    },
    onError(messageText) {
      $("error").textContent = messageText || "No se pudo actualizar el pedido.";
      $("error").classList.remove("hidden");
    }
  }) || null;
}

function availabilityMessage() {
  if (!availability) return null;

  if (availability.is_open === true) {
    if (availability.reason === "NO_SCHEDULE_CONFIGURED") {
      return {
        text: "Disponible para pedidos",
        className: "availability-open"
      };
    }

    return {
      text: availability.closing_time
        ? `Abierto ahora · cierra a las ${availability.closing_time}`
        : "Abierto ahora",
      className: "availability-open"
    };
  }

  if (availability.reason === "BEFORE_OPENING" && availability.opening_time) {
    return {
      text: `Cerrado ahora · abre a las ${availability.opening_time}`,
      className: "availability-closed"
    };
  }

  if (availability.reason === "CLOSED_TODAY") {
    return {
      text: "Cerrado hoy",
      className: "availability-closed"
    };
  }

  if (availability.reason === "AFTER_CLOSING") {
    return {
      text: "Cerrado por hoy",
      className: "availability-closed"
    };
  }

  return {
    text: "No disponible para pedidos en este momento",
    className: "availability-closed"
  };
}

function claimEntryUrl(){
  const claimPath="/htpweb/app/reclamar-negocio.html?business="+encodeURIComponent(businessActual?.id||"")+
    "&delivery="+encodeURIComponent(negocioActual?.slug||"");
  return viewerUser
    ? claimPath
    : "/htpweb/app/acceso.html?return="+encodeURIComponent(claimPath);
}

function render() {
  document.title = `${businessActual.name} | ${negocioActual.name}`;
  $("localName").textContent = businessActual.name;

  const currentAvailability = availabilityMessage();

  $("localCard").innerHTML = `
    ${businessActual.banner_url ? `<img src="${esc(businessActual.banner_url)}" alt="${esc(businessActual.name)}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px">` : ""}
    <div class="row between" style="margin-top:12px">
      <h1 style="margin:0">${esc(businessActual.name)}</h1>
      ${currentAvailability ? `<span class="availability-badge ${currentAvailability.className}">${availability?.is_open === true ? "DISPONIBLE" : "CERRADO"}</span>` : ""}
    </div>
    <p class="muted">${esc(businessActual.description || "")}</p>
    ${businessActual.address ? `<p><strong>Dirección:</strong> ${esc(businessActual.address)}</p>` : ""}
    ${currentAvailability ? `<p class="local-availability-detail ${currentAvailability.className}">${esc(currentAvailability.text)}</p>` : ""}
    ${claimState?.claimed ? `
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid #e5e7eb">
        <small class="muted">✓ Información administrada por el negocio.</small>
      </div>
    ` : claimState?.pending ? `
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid #e5e7eb">
        <small class="muted">La propiedad de este negocio está actualmente en proceso de verificación.</small>
      </div>
    ` : `
      <div style="margin-top:18px;padding-top:14px;border-top:1px solid #e5e7eb">
        <strong style="display:block;margin-bottom:4px">¿Administras este negocio?</strong>
        <span class="muted" style="display:block;margin-bottom:10px">Verifica tu propiedad para actualizar productos, promociones, horarios y administrar este negocio.</span>
        <a class="btn btn-muted" href="${claimEntryUrl()}">Reclamar este negocio</a>
      </div>
    `}
  `;

  const orderNotice = $("localOrderStatusNotice");
  if (orderNotice) {
    const closed = availability && availability.is_open !== true;
    orderNotice.classList.toggle("hidden", !closed);
    orderNotice.textContent = closed
      ? "Este negocio está CERRADO en este momento. Puedes consultar el menú y los precios, pero no agregar productos hasta que vuelva a estar disponible."
      : "";
  }

  $("products").innerHTML = products.length ? products.map(product => {
    const vs = variants.filter(v => v.product_id === product.id);
    const minPrice = vs.length ? Math.min(...vs.map(v => Number(v.price))) : Number(product.price || 0);

    return `
      <div class="product-row" id="product-${product.id}">
        <div>${product.image_url ? `<img src="${esc(product.image_url)}" alt="${esc(product.name)}">` : ""}</div>
        <div>
          <strong>${esc(product.name)}</strong>
          <div class="muted">${esc(product.description || "")}</div>
          <div class="price" id="price-${product.id}">$ ${minPrice.toFixed(2)}</div>

          ${vs.length ? `
            <label>Variante</label>
            <select id="variant-${product.id}" onchange="syncVariantPrice('${product.id}')">
              ${vs.map(v => `<option value="${v.id}" data-price="${Number(v.price)}">${esc(v.name)} — $${Number(v.price).toFixed(2)}</option>`).join("")}
            </select>
          ` : ""}

          <div class="row product-buy-row">
            ${availability && availability.is_open !== true ? `
              <div class="closed-order-control" aria-label="Disponible cuando abra">
                <span class="closed-order-lock" aria-hidden="true">🔒</span>
                <span>Disponible cuando abra</span>
              </div>
            ` : `
              <div class="quantity-stepper" aria-label="Cantidad en carrito">
                <button
                  type="button"
                  class="qty-step-btn"
                  aria-label="Disminuir cantidad"
                  onclick="event.stopPropagation(); changeProductQuantity('${product.id}', -1)"
                >−</button>
                <input id="qty-${product.id}" type="number" min="0" step="1" value="${cartQuantityForProduct(product.id, vs[0]?.id || null)}" aria-label="Cantidad en carrito" oninput="event.stopPropagation(); setProductQuantity('${product.id}', this.value)">
                <button
                  type="button"
                  class="qty-step-btn"
                  aria-label="Aumentar cantidad"
                  onclick="event.stopPropagation(); changeProductQuantity('${product.id}', 1)"
                >+</button>
              </div>
              <button
                class="btn btn-primary"
                onclick="event.stopPropagation(); addProduct('${product.id}')"
              >Agregar</button>
            `}
          </div>
        </div>
      </div>
    `;
  }).join("") : '<div class="empty">Este negocio todavía no tiene productos disponibles.</div>';
}

function productCartMatcher(productId, explicitVariantId = undefined) {
  const select = document.getElementById("variant-" + productId);
  const variantId = explicitVariantId !== undefined
    ? (explicitVariantId || null)
    : (select?.value || null);

  return {
    local_id: businessActual?.id || "",
    product_id: productId,
    variant_id: variantId
  };
}

function cartQuantityForProduct(productId, variantId = undefined) {
  if (!negocioActual?.slug || !businessActual?.id || typeof carritoCantidadItem !== "function") return 0;
  return carritoCantidadItem(negocioActual.slug, productCartMatcher(productId, variantId));
}

function syncProductCartQuantity(productId) {
  const input = $("qty-" + productId);
  if (!input) return 0;
  const total = cartQuantityForProduct(productId);
  input.value = total;
  return total;
}

function syncAllProductCartQuantities() {
  products.forEach(product => syncProductCartQuantity(product.id));
}

function syncVariantPrice(productId) {
  const select = document.getElementById("variant-" + productId);
  if (select) {
    const option = select.selectedOptions[0];
    $("price-" + productId).textContent = "$ " + Number(option.dataset.price || 0).toFixed(2);
  }
  syncProductCartQuantity(productId);
}

function resolveProductVariant(productId, explicitVariantId = undefined) {
  const variantId = explicitVariantId !== undefined
    ? (explicitVariantId || null)
    : (document.getElementById("variant-" + productId)?.value || null);

  return variantId
    ? variants.find(v => v.id === variantId && v.product_id === productId) || null
    : null;
}

function addProductUnit(productId, explicitVariantId = undefined) {
  const product = products.find(p => p.id === productId);
  if (!product) return 0;

  if (availability && availability.is_open !== true) {
    const info = availabilityMessage();
    $("error").textContent = info?.text || "Este negocio no está disponible para pedidos en este momento.";
    $("error").classList.remove("hidden");
    return cartQuantityForProduct(productId, explicitVariantId ?? null);
  }

  $("error").classList.add("hidden");

  const variant = resolveProductVariant(productId, explicitVariantId);

  carritoAgregar(negocioActual.slug, {
    local_id: businessActual.id,
    product_id: product.id,
    variant_id: variant?.id || null,
    snapshot: {
      local_name: businessActual.name,
      product_name: product.name,
      variant_name: variant?.name || null
    }
  }, 1);

  updateCartCount();
  syncProductCartQuantity(productId);

  return carritoCantidadItem(
    negocioActual.slug,
    productCartMatcher(productId, variant?.id || null)
  );
}

function changeProductQuantity(productId, delta, explicitVariantId = undefined) {
  const variant = resolveProductVariant(productId, explicitVariantId);
  const matcher = productCartMatcher(productId, variant?.id || null);
  const current = carritoCantidadItem(negocioActual.slug, matcher);

  if (Number(delta) > 0) {
    return addProductUnit(productId, variant?.id || null);
  }

  if (current <= 0) {
    syncProductCartQuantity(productId);
    return 0;
  }

  const next = Math.max(0, current - 1);
  if (next === 0) carritoEliminar(negocioActual.slug, matcher);
  else carritoCambiarCantidad(negocioActual.slug, matcher, next);

  updateCartCount();
  syncProductCartQuantity(productId);
  return next;
}

function setProductQuantity(productId, quantity, explicitVariantId = undefined) {
  const product = products.find(p => p.id === productId);
  if (!product) return 0;

  const parsedQuantity = Number.parseInt(quantity, 10);
  if (!Number.isFinite(parsedQuantity) || parsedQuantity < 0) {
    return syncProductCartQuantity(productId);
  }

  const variant = resolveProductVariant(productId, explicitVariantId);
  const matcher = productCartMatcher(productId, variant?.id || null);
  const current = carritoCantidadItem(negocioActual.slug, matcher);
  const next = Math.max(0, parsedQuantity);

  if (next === current) {
    syncProductCartQuantity(productId);
    return next;
  }

  if (next === 0) {
    carritoEliminar(negocioActual.slug, matcher);
  } else if (current <= 0) {
    carritoAgregar(negocioActual.slug, {
      local_id: businessActual.id,
      product_id: product.id,
      variant_id: variant?.id || null,
      snapshot: {
        local_name: businessActual.name,
        product_name: product.name,
        variant_name: variant?.name || null
      }
    }, next);
  } else {
    carritoCambiarCantidad(negocioActual.slug, matcher, next);
  }

  updateCartCount();
  syncProductCartQuantity(productId);
  return next;
}

function addProduct(productId) {
  return addProductUnit(productId);
}

window.htpwebAddProductUnit = addProductUnit;
window.htpwebChangeProductQuantity = changeProductQuantity;
window.htpwebSetProductQuantity = setProductQuantity;
window.htpwebProductCartMatcher = productCartMatcher;
window.syncVariantPrice = syncVariantPrice;

function updateCartCount() {
  if (!negocioActual) return;
  $("cartCount").textContent = carritoCantidad(negocioActual.slug);
}

window.addEventListener("htpweb:cart", () => {
  updateCartCount();
  syncAllProductCartQuantities();
});
init();
</script>
<script src="../config/media-viewer.js?v=202609271312"></script>
<script src="../config/menu-viewer.js?v=20261002-closed1"></script>
<script src="../config/promotions.js?v=20261002-promo-filter1"></script>
</body>
</html>
