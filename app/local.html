<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:16px;text-align:center}
main{max-width:700px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.banner{width:100%;height:220px;object-fit:cover;border-radius:10px}
h2,h3{margin-top:0}
.producto{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
.producto:last-child{border-bottom:0}
.producto img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#eee}
.info{flex:1}
.precio{font-weight:bold;font-size:18px;margin:8px 0}
.descripcion{font-size:14px;color:#666}
button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:bold}
.btn{background:#111;color:#fff}
.btn-carrito{width:100%;padding:13px;margin-top:15px}
.btn-add{background:#111;color:#fff}
.btn-add:disabled{opacity:.6}
.cantidad{display:flex;align-items:center;gap:8px;margin-top:8px}
.cantidad button{background:#eee}
.vacio{text-align:center;padding:30px;color:#666}
#carritoBar{position:sticky;bottom:15px;z-index:10}
#btnCarrito{display:none}
.msg{padding:12px;border-radius:8px;background:#e8f5e9;color:#1b5e20;margin-bottom:15px;display:none}
</style>
</head>

<body>

<header>
  <h2 id="nombreNegocio">Cargando...</h2>
  <div id="nombreLocal"></div>
</header>

<main>

<div id="mensaje" class="msg"></div>

<section class="card" id="contenido"></section>

<div id="carritoBar">
  <button class="btn btn-carrito" id="btnCarrito">
    Ver mi pedido
  </button>
</div>

</main>

<script>
const $=id=>document.getElementById(id);

let negocioActual=null;
let local=null;
let productos=[];
let pedidoId=null;
let colaAgregar=[];
let procesandoCola=false;

const cantidades={};

const params=new URLSearchParams(location.search);
const localId=params.get("id");

async function iniciar(){

  if(!localId){
    $("contenido").innerHTML=
      '<div class="vacio">No se especificó el local.</div>';
    return;
  }

  try{

    negocio=await cargarNegocio();
    negocioActual=negocio;

    $("nombreNegocio").textContent=negocio.nombre;

    await cargarLocal();

    await cargarProductos();

  }catch(e){

    console.error(e);

    $("contenido").innerHTML=
      '<div class="vacio">No se pudo cargar el local.</div>';

  }
}

async function cargarLocal(){

  const {data,error}=await supabaseClient
    .from("locales")
    .select(`
      id,
      nombre,
      categoria,
      descripcion,
      banner_url
    `)
    .eq("id",localId)
    .eq("cliente_id",negocioActual.id)
    .eq("activo",true)
    .single();

  if(error||!data)
    throw new Error("Local no encontrado.");

  local=data;

  $("nombreLocal").textContent=local.nombre;

  $("contenido").innerHTML=`

    ${local.banner_url
      ?`<img class="banner"
          src="${escapeHtml(local.banner_url)}"
          alt="${escapeHtml(local.nombre)}">`
      :""
    }

    <h2>${escapeHtml(local.nombre)}</h2>

    ${local.descripcion
      ?`<p class="descripcion">
          ${escapeHtml(local.descripcion)}
        </p>`
      :""
    }

    <div id="productos">
      <div class="vacio">Cargando productos...</div>
    </div>

  `;
}

async function cargarProductos(){

  const {data,error}=await supabaseClient
    .from("productos")
    .select(`
      id,
      nombre,
      descripcion,
      precio,
      imagen_url,
      activo
    `)
    .eq("cliente_id",negocioActual.id)
    .eq("local_id",local.id)
    .eq("activo",true)
    .order("nombre");

  if(error) throw error;

  productos=data||[];

  renderProductos();
}

function renderProductos(){

  if(!productos.length){

    $("productos").innerHTML=
      '<div class="vacio">Este local no tiene productos disponibles.</div>';

    return;
  }

  $("productos").innerHTML=productos.map(p=>{

    const cantidad=cantidades[p.id]||0;

    return `

      <div class="producto">

        ${p.imagen_url
          ?`<img
              src="${escapeHtml(p.imagen_url)}"
              alt="${escapeHtml(p.nombre)}">`
          :""
        }

        <div class="info">

          <strong>${escapeHtml(p.nombre)}</strong>

          ${p.descripcion
            ?`<div class="descripcion">
                ${escapeHtml(p.descripcion)}
              </div>`
            :""
          }

          <div class="precio">
            $${Number(p.precio).toFixed(2)}
          </div>

          <div class="cantidad">

            <button
              onclick="cambiarCantidad('${p.id}',${cantidad-1})"
              ${cantidad<=0?"disabled":""}>
              −
            </button>

            <strong>${cantidad}</strong>

            <button
              onclick="cambiarCantidad('${p.id}',${cantidad+1})">
              +
            </button>

          </div>

        </div>

      </div>

    `;

  }).join("");

}

async function cambiarCantidad(productoId,nuevaCantidad){

  if(nuevaCantidad<0) return;

  const actual=cantidades[productoId]||0;

  if(nuevaCantidad===actual) return;

  cantidades[productoId]=nuevaCantidad;

  renderProductos();

  const diferencia=nuevaCantidad-actual;

  if(diferencia!==0){

    colaAgregar.push({
      productoId,
      cantidad:diferencia
    });

    procesarCola();

  }
}

async function procesarCola(){

  if(procesandoCola) return;

  procesandoCola=true;

  try{

    while(colaAgregar.length){

      const item=colaAgregar.shift();

      await agregarProducto(
        item.productoId,
        item.cantidad
      );

    }

  }catch(e){

    console.error(e);

    alert(
      e.message||
      "No se pudo actualizar el pedido."
    );

  }finally{

    procesandoCola=false;

  }
}

async function obtenerOCrearCarrito(){

  if(pedidoId) return pedidoId;

  const {data,error}=await supabaseClient.rpc(
    "crear_carrito",
    {
      p_cliente_id:negocioActual.id
    }
  );

  if(error) throw error;

  pedidoId=data;

  return pedidoId;
}

async function agregarProducto(productoId,cantidad){

  const id=await obtenerOCrearCarrito();

  if(cantidad>0){

    const {error}=await supabaseClient.rpc(
      "agregar_al_carrito",
      {
        p_pedido_id:id,
        p_producto_id:productoId,
        p_cantidad:cantidad
      }
    );

    if(error) throw error;

  }else{

    await sincronizarCantidadProducto(
      id,
      productoId
    );

  }

  actualizarBotonCarrito();
}

async function sincronizarCantidadProducto(
  pedidoId,
  productoId
){

  const {data,error}=await supabaseClient.rpc(
    "obtener_carrito",
    {
      p_pedido_id:pedidoId
    }
  );

  if(error) throw error;

  const item=(data||[]).find(
    x=>x.producto_id===productoId
  );

  if(!item) return;

  const cantidadDeseada=
    cantidades[productoId]||0;

  const diferencia=
    cantidadDeseada-Number(item.cantidad);

  if(diferencia===0) return;

  if(diferencia>0){

    const {error:e}=await supabaseClient.rpc(
      "agregar_al_carrito",
      {
        p_pedido_id:pedidoId,
        p_producto_id:productoId,
        p_cantidad:diferencia
      }
    );

    if(e) throw e;

  }else{

    const nuevaCantidad=
      Number(item.cantidad)+diferencia;

    if(nuevaCantidad<=0){

      const {error:e}=await supabaseClient.rpc(
        "eliminar_del_carrito",
        {
          p_detalle_id:item.detalle_id
        }
      );

      if(e) throw e;

    }else{

      const {error:e}=await supabaseClient.rpc(
        "actualizar_cantidad_carrito",
        {
          p_detalle_id:item.detalle_id,
          p_cantidad:nuevaCantidad
        }
      );

      if(e) throw e;

    }

  }
}

function actualizarBotonCarrito(){

  if(!pedidoId) return;

  $("btnCarrito").style.display="block";
  $("btnCarrito").textContent="Ver mi pedido";

}

$("btnCarrito").onclick=()=>{

  if(!pedidoId) return;

  location.href=
    `carrito.html?pedido=${encodeURIComponent(pedidoId)}&cliente=${encodeURIComponent(negocioActual.slug)}`;

};

function escapeHtml(text){

  return String(text??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

iniciar();
</script>

</body>
</html>
