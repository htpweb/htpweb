<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda HTPWEB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/auth.js?v=20261004-profiles2"></script>
<script src="../config/cart.js"></script>
<link rel="stylesheet" href="../assets/app.css?v=20261002-localstore1">
<style>
:root{--local-accent:#111827;--local-secondary:#475467;--local-bg:#f6f7f9;--local-surface:#fff;--local-text:#111827;--local-radius:18px;--local-gap:18px}
html{scroll-behavior:smooth}
body.local-store{background:var(--local-bg);color:var(--local-text)}
.local-store-shell{max-width:1180px;margin:0 auto;padding:18px}
.local-store-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}
.local-store-header-inner{max-width:1180px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.local-brand{display:flex;gap:12px;align-items:center}.local-brand img{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#fff;border:1px solid #e5e7eb}
.local-brand strong{font-size:1.05rem}.local-brand small{display:block;color:#6b7280}
.local-site-nav{display:flex;gap:16px;align-items:center;justify-content:center;flex:1}.local-site-nav a{color:var(--local-text);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}.local-site-nav a:hover{color:var(--local-accent)}
.local-cart-btn{border:0;background:var(--local-accent);color:#fff;border-radius:999px;padding:11px 16px;font-weight:700}
.local-page-section{scroll-margin-top:92px;margin:24px 0}.local-page-card{background:var(--local-surface);border-radius:var(--local-radius);padding:24px;border:1px solid rgba(100,116,139,.16);box-shadow:0 8px 28px rgba(15,23,42,.05)}
.local-page-section h2{margin:0 0 10px}.local-page-section p{line-height:1.65}.local-contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.local-contact-item{background:var(--local-bg);border-radius:14px;padding:14px}.local-contact-item small{display:block;color:var(--local-secondary);margin-bottom:4px}
.local-hero-cta{display:inline-flex;margin-top:14px;background:var(--local-accent);color:#fff;text-decoration:none;border-radius:12px;padding:10px 14px;font-weight:800}
.local-hero{overflow:hidden;background:#fff;border-radius:var(--local-radius);margin-bottom:18px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.local-hero img{width:100%;height:300px;object-fit:cover;display:block}.local-hero-copy{padding:22px}
.local-hero h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,3rem)}.local-hero p{margin:0;color:#6b7280}
.local-socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.local-socials a{padding:8px 12px;border:1px solid #e5e7eb;border-radius:999px;text-decoration:none;color:inherit}
.local-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.local-toolbar input{flex:1;min-width:220px}
.local-cats{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.local-cats button{white-space:nowrap;border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:8px 12px}.local-cats button.active{background:var(--local-accent);color:#fff;border-color:var(--local-accent)}
.local-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--local-gap)}
.product-card{background:#fff;border-radius:var(--local-radius);overflow:hidden;border:1px solid #e5e7eb;display:flex;flex-direction:column}
.product-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f3f4f6}.product-card .body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.product-card h3{margin:0}.price{font-weight:800;font-size:1.05rem}.product-card button{margin-top:auto;background:var(--local-accent);color:#fff;border:0;border-radius:12px;padding:10px;font-weight:700}.product-card button:disabled{opacity:.45}
.local-grid.compact{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.local-grid.compact .product-card img{aspect-ratio:4/3}.local-grid.compact .body{padding:11px}
.visual-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}.menu-page{background:#fff;border-radius:var(--local-radius);padding:10px;border:1px solid #e5e7eb}.menu-page img{width:100%;height:auto;border-radius:calc(var(--local-radius) - 6px)}
.preset-FASHION_EDITORIAL .local-hero img{height:420px}.preset-FASHION_EDITORIAL .product-card img{aspect-ratio:3/4}
.preset-HARDWARE_CATALOG .local-hero img,.preset-HEALTH_CLEAN .local-hero img,.preset-GROCERY_DENSE .local-hero img{height:180px}
.preset-BOOKS_STATIONERY .local-hero{display:grid;grid-template-columns:1fr 1fr}.preset-BOOKS_STATIONERY .local-hero img{height:100%;min-height:300px}.preset-BOOKS_STATIONERY .product-card img{aspect-ratio:4/5}
.preset-FLOWERS_GIFTS .local-hero img{height:430px}.preset-FLOWERS_GIFTS .local-hero-copy{text-align:center}.preset-FLOWERS_GIFTS .product-card{box-shadow:0 12px 26px rgba(217,54,112,.08)}
.preset-ENGINEERING_PRO .local-hero{display:grid;grid-template-columns:1.15fr .85fr}.preset-ENGINEERING_PRO .local-hero img{height:100%;min-height:330px}.preset-ENGINEERING_PRO .local-hero-copy{display:flex;flex-direction:column;justify-content:center}.preset-ENGINEERING_PRO .product-card img,.preset-HEALTH_SERVICES .product-card img{aspect-ratio:16/9}
.preset-HEALTH_SERVICES .local-hero{border-top:6px solid var(--local-accent)}.preset-HEALTH_SERVICES .local-page-card{box-shadow:none}
.preset-BEAUTY_BOOKING .local-hero img{height:400px}.preset-BEAUTY_BOOKING .product-card img{aspect-ratio:4/5}
.preset-SERVICES_SHOWCASE .local-grid,.preset-ENGINEERING_PRO .local-grid,.preset-HEALTH_SERVICES .local-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.surface-SQUARE{--local-radius:4px}.surface-ROUNDED{--local-radius:28px}.surface-EDITORIAL{--local-radius:0px}
.empty{padding:30px;text-align:center;background:#fff;border-radius:var(--local-radius);color:#6b7280}
@media(max-width:820px){.local-store-header-inner{flex-wrap:wrap}.local-site-nav{order:3;flex-basis:100%;overflow:auto;justify-content:flex-start;padding:4px 0 2px}.local-grid,.local-grid.compact,.preset-SERVICES_SHOWCASE .local-grid,.preset-ENGINEERING_PRO .local-grid,.preset-HEALTH_SERVICES .local-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.visual-menu{grid-template-columns:1fr}.local-hero img{height:220px}.preset-BOOKS_STATIONERY .local-hero,.preset-ENGINEERING_PRO .local-hero{grid-template-columns:1fr}.local-contact-grid{grid-template-columns:1fr}}
@media(max-width:520px){.local-store-shell{padding:10px}.local-grid,.local-grid.compact{grid-template-columns:1fr 1fr;gap:8px}.product-card .body{padding:10px}.product-card p{display:none}.local-brand small{font-size:.75rem}.local-site-nav{gap:12px}.local-site-nav a{font-size:.82rem}}
</style>
</head>
<body class="local-store">
<header class="local-store-header"><div class="local-store-header-inner">
  <div class="local-brand"><img id="brandLogo" class="hidden" alt=""><div><strong id="brandName">LOCAL</strong><small>Plataforma de HTPWEB</small></div></div>
  <nav id="siteNav" class="local-site-nav">
    <a href="#inicio">Inicio</a>
    <a id="aboutNav" href="#aboutSection">Quiénes somos</a>
    <a id="catalogNav" href="#catalogSection">Productos</a>
    <a id="contactNav" href="#contactSection">Contacto</a>
  </nav>
  <button id="cartBtn" class="local-cart-btn">🛒 <span id="cartCount">0</span></button>
</div></header>
<main class="local-store-shell">
  <div id="error" class="error hidden"></div>
  <section id="hero" class="local-hero"></section>
  <section id="aboutSection" class="local-page-section hidden"><div class="local-page-card"><h2 id="aboutTitle">Quiénes somos</h2><p id="aboutText"></p></div></section>
  <section id="catalogSection" class="local-page-section">
    <h2 id="catalogTitle">Productos</h2>
    <div class="local-toolbar">
      <input id="search" type="search" placeholder="Buscar productos o servicios">
      <div id="cats" class="local-cats"></div>
    </div>
    <section id="promotionsSection" class="hidden"><h2>Promociones</h2><div id="promotions" class="local-grid"></div></section>
    <section id="menuSection" class="hidden"><h2>Menú</h2><div id="menuPages" class="visual-menu"></div></section>
    <section id="productsSection"><div id="products" class="local-grid"></div></section>
  </section>
  <section id="contactSection" class="local-page-section hidden"><div class="local-page-card"><h2 id="contactTitle">Contacto</h2><div id="contactGrid" class="local-contact-grid"></div><div id="contactSocials"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const params=new URLSearchParams(location.search);
const key=params.get("local")||"";
const source=(params.get("src")||"direct").toLowerCase();
const campaign=params.get("campaign")||"";
const sharedProductId=params.get("product")||"";
const localAnalyticsSession=sessionStorage.getItem("HTPWEB_LOCAL_ANALYTICS_SESSION")||crypto.randomUUID();
sessionStorage.setItem("HTPWEB_LOCAL_ANALYTICS_SESSION",localAnalyticsSession);
let store=null,products=[],variants=[],categories=[],inventory=[],promotions=[],activeCategory="";
const promotionMixSelections=new Map();
async function trackLocal(eventType,productId=null,metadata={}){
 try{
  if(!store?.local?.id)return;
  await supabaseClient.rpc("record_local_storefront_event",{
   p_event_type:eventType,p_local_id:store.local.id,p_product_id:productId,
   p_session_id:localAnalyticsSession,p_source:source,p_metadata:{campaign,...metadata}
  });
 }catch(e){console.warn("Analytics LOCAL:",e?.message||e);}
}
function scope(){return source==="htpweb"?"HTPWEB":(store?.local?.id?"LOCAL:"+store.local.id:"LOCAL:UNKNOWN");}
function money(v){return "$"+Number(v||0).toFixed(2);}
function itemMatcher(p,v=null){return{local_id:store.local.id,product_id:p.id,variant_id:v?.id||null};}
function stockFor(p,v=null){return inventory.find(x=>x.product_id===p.id&&(x.variant_id||null)===(v?.id||null));}
function updateCount(){$("cartCount").textContent=carritoCantidad(scope());}
function socials(local){
 const rows=[["Instagram",local.instagram_url],["Facebook",local.facebook_url],["TikTok",local.tiktok_url],["Web",local.website_url]].filter(x=>x[1]);
 return rows.length?'<div class="local-socials">'+rows.map(([n,u])=>'<a target="_blank" rel="noopener" href="'+esc(u)+'">'+esc(n)+'</a>').join("")+'</div>':"";
}
function pageContent(){return store?.settings?.content_config||{}}
function catalogLabel(){
 const cfg=pageContent();
 return cfg.catalog_title||store?.preset?.config?.catalog_label||(["SERVICES","PROFESSIONAL","HEALTH","BEAUTY"].includes(store?.preset?.layout_family)?"Servicios":"Productos");
}
function applyStoreTheme(){
 const t=store?.theme||{};
 const root=document.documentElement.style;
 root.setProperty("--local-accent",store?.settings?.accent_color||t.primary_color||"#111827");
 root.setProperty("--local-secondary",t.secondary_color||"#475467");
 root.setProperty("--local-bg",t.background_color||"#f6f7f9");
 root.setProperty("--local-surface",t.surface_color||"#fff");
 root.setProperty("--local-text",t.text_color||"#111827");
}
function renderPageSections(){
 const l=store.local,cfg=pageContent(),label=catalogLabel();
 $("aboutTitle").textContent=cfg.about_title||"Quiénes somos";
 $("aboutText").textContent=cfg.about_text||l.description||"";
 $("aboutSection").classList.toggle("hidden",cfg.show_about===false||!($("aboutText").textContent.trim()));
 $("aboutNav").classList.toggle("hidden",cfg.show_about===false||!($("aboutText").textContent.trim()));
 $("catalogTitle").textContent=label;$("catalogNav").textContent=label;
 $("catalogSection").classList.toggle("hidden",cfg.show_catalog===false);$("catalogNav").classList.toggle("hidden",cfg.show_catalog===false);
 $("contactTitle").textContent=cfg.contact_title||"Contacto";$("contactNav").textContent=cfg.contact_title||"Contacto";
 const contacts=[["Dirección",l.address],["Teléfono",l.phone],["WhatsApp",l.whatsapp]].filter(x=>x[1]);
 $("contactGrid").innerHTML=contacts.map(([name,value])=>'<div class="local-contact-item"><small>'+esc(name)+'</small><strong>'+esc(value)+'</strong></div>').join("");
 $("contactSocials").innerHTML=socials(l);
 const hasContact=contacts.length||$("contactSocials").innerHTML;
 $("contactSection").classList.toggle("hidden",cfg.show_contact===false||!hasContact);$("contactNav").classList.toggle("hidden",cfg.show_contact===false||!hasContact);
 $("promotionsSection").dataset.pageEnabled=cfg.show_promotions===false?"0":"1";
 $("search").placeholder="Buscar "+label.toLowerCase();
}
function renderHero(){
 const l=store.local,cfg=pageContent();
 $("brandName").textContent=l.name;
 if(l.logo_url){$("brandLogo").src=l.logo_url;$("brandLogo").classList.remove("hidden");}
 const title=cfg.hero_title||l.name,subtitle=cfg.hero_subtitle||l.description||"";
 const cta=l.whatsapp?'<a class="local-hero-cta" target="_blank" rel="noopener" href="https://wa.me/'+esc(String(l.whatsapp).replace(/\D/g,""))+'">Contactar por WhatsApp</a>':"";
 $("hero").innerHTML=(l.banner_url?'<img src="'+esc(l.banner_url)+'" alt="">':"")+
   '<div class="local-hero-copy"><h1>'+esc(title)+'</h1><p>'+esc(subtitle)+'</p>'+cta+'</div>';
}
function renderCats(){
 const visible=categories.filter(c=>products.some(p=>p.category_id===c.id));
 $("cats").innerHTML='<button data-cat="" class="'+(!activeCategory?"active":"")+'">Todos</button>'+
   visible.map(c=>'<button data-cat="'+esc(c.id)+'" class="'+(activeCategory===c.id?"active":"")+'">'+esc(c.name)+'</button>').join("");
 $("cats").querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCats();renderProducts();});
}
function renderProducts(){
 const q=$("search").value.trim().toLowerCase();
 const filtered=products.filter(p=>(!activeCategory||p.category_id===activeCategory)&&(!q||[p.name,p.description].some(v=>String(v||"").toLowerCase().includes(q))));
 $("products").className="local-grid "+(store.settings.card_density==="COMPACT"?"compact":"");
 if(!filtered.length){$("products").innerHTML='<div class="empty">No hay productos que coincidan.</div>';return;}
 $("products").innerHTML=filtered.map(p=>{
   const vs=variants.filter(v=>v.product_id===p.id);
   const baseStock=stockFor(p,null);
   const soldOut=baseStock?.track_stock&&Number(baseStock.available_qty||0)<=0&&!vs.length;
   const controls=vs.length?'<div>'+vs.map(v=>{
     const st=stockFor(p,v),off=st?.track_stock&&Number(st.available_qty||0)<=0;
     return '<button '+(off?"disabled":"")+' data-add="'+p.id+'" data-var="'+v.id+'">'+esc(v.name)+' · '+money(v.price)+(off?" · AGOTADO":"")+'</button>';
   }).join("")+'</div>':'<button '+(soldOut?"disabled":"")+' data-add="'+p.id+'">'+(soldOut?"AGOTADO":"Agregar · "+money(p.price))+'</button>';
   return '<article class="product-card" id="product-'+esc(p.id)+'">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'<div style="aspect-ratio:1/1;background:#eef2f7"></div>')+
     '<div class="body"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||"")+'</p>'+(!vs.length?'<div class="price">'+money(p.price)+'</div>':"")+controls+'</div></article>';
 }).join("");
 $("products").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
   const p=products.find(x=>x.id===b.dataset.add),v=variants.find(x=>x.id===b.dataset.var),matcher=itemMatcher(p,v);
   const st=stockFor(p,v),current=carritoCantidadItem(scope(),matcher);
   if(st?.track_stock&&current>=Number(st.available_qty||0)){
     $("error").textContent=p.name+" alcanzó el stock disponible.";$("error").classList.remove("hidden");return;
   }
   carritoAgregar(scope(),{...matcher,snapshot:{name:p.name,variant_name:v?.name||null,price:Number(v?.price??p.price),image_url:p.image_url||null}},1);
   $("error").classList.add("hidden");trackLocal("CART_VIEW",p.id,{action:"add"});
   updateCount();
 });
}
function promotionMixConfig(p){
 const items=Array.isArray(p?.items)?p.items:[];
 if(p?.promotion_type!=="COMBO"||items.length!==1)return null;
 const item=items[0],vs=Array.isArray(item.variants)?item.variants:[],required=Number(item.quantity||0);
 if(item.variant_id||required<=1||!vs.length)return null;
 return{item,variants:vs,required};
}
function promotionMixState(p){
 const cfg=promotionMixConfig(p);if(!cfg)return null;
 if(!promotionMixSelections.has(p.id))promotionMixSelections.set(p.id,new Map(cfg.variants.map(v=>[v.id,0])));
 return{cfg,quantities:promotionMixSelections.get(p.id)};
}
function promotionMixTotal(p){const s=promotionMixState(p);return s?[...s.quantities.values()].reduce((a,b)=>a+Number(b||0),0):0}
function addStandalonePromotion(p,option=null){
 const price=Number(option?.promo_price??p.promotion_price??0);
 carritoAgregar(scope(),{
  kind:"PROMOTION",local_id:store.local.id,promotion_id:p.id,promotion_item_id:option?.id||null,
  snapshot:{local_name:store.local.name,promotion_title:p.title,promotion_type:p.promotion_type,
   promotion_image_url:p.image_url||null,option_name:option?(option.product_name+(option.variant_name?" · "+option.variant_name:"")):null,
   price}
 },1);
 trackLocal("CART_VIEW",null,{action:"add_promotion",promotion_id:p.id});updateCount();
}
function changePromotionMix(p,variantId,delta){
 const s=promotionMixState(p);if(!s)return;
 const current=Number(s.quantities.get(variantId)||0),total=promotionMixTotal(p);
 let next=Math.max(0,current+delta);if(delta>0&&total>=s.cfg.required)next=current;
 s.quantities.set(variantId,next);renderPromotions();
}
function addMixedPromotion(p){
 const s=promotionMixState(p);if(!s)return;
 if(promotionMixTotal(p)!==s.cfg.required){$("error").textContent="Selecciona exactamente "+s.cfg.required+" opciones para "+p.title+".";$("error").classList.remove("hidden");return;}
 const selection=s.cfg.variants.map(v=>({product_id:s.cfg.item.product_id,product_name:s.cfg.item.product_name,variant_id:v.id,variant_name:v.name,quantity:Number(s.quantities.get(v.id)||0)})).filter(x=>x.quantity>0);
 carritoAgregar(scope(),{kind:"PROMOTION",local_id:store.local.id,promotion_id:p.id,promotion_item_id:null,
  snapshot:{local_name:store.local.name,promotion_title:p.title,promotion_type:p.promotion_type,promotion_image_url:p.image_url||null,
   promotion_selection:selection,promotion_selection_required:s.cfg.required,price:Number(p.promotion_price||0)}},1);
 $("error").classList.add("hidden");trackLocal("CART_VIEW",null,{action:"add_promotion",promotion_id:p.id});updateCount();
}
function renderPromotions(){
 const available=promotions.filter(p=>p.available_now);
 const enabled=$("promotionsSection").dataset.pageEnabled!=="0";
 $("promotionsSection").classList.toggle("hidden",!enabled||available.length===0);
 $("promotions").innerHTML=available.map(p=>{
   const items=Array.isArray(p.items)?p.items:[],subtitle=p.body||(items.map(i=>i.product_name).join(" · "));
   const price=p.promotion_price!=null?'<div class="price">'+money(p.promotion_price)+'</div>':"";
   let controls="";
   const mix=promotionMixConfig(p);
   if(p.promotion_type==="OPTIONS"){
     controls='<div>'+items.map(i=>'<button data-promo-add="'+esc(p.id)+'" data-option="'+esc(i.id)+'">'+esc(i.product_name+(i.variant_name?" · "+i.variant_name:""))+' · '+money(i.promo_price)+'</button>').join("")+'</div>';
   }else if(mix){
     const state=promotionMixState(p);
     controls='<div><small>Elige exactamente '+mix.required+' opciones</small>'+mix.variants.map(v=>'<div class="row between" style="gap:8px;margin-top:6px"><span>'+esc(v.name)+'</span><span class="row"><button type="button" data-mix-minus="'+esc(p.id)+'" data-var="'+esc(v.id)+'">−</button><strong>'+Number(state.quantities.get(v.id)||0)+'</strong><button type="button" data-mix-plus="'+esc(p.id)+'" data-var="'+esc(v.id)+'">+</button></span></div>').join("")+
      '<button style="margin-top:8px" data-mix-add="'+esc(p.id)+'">Agregar combo · '+money(p.promotion_price)+'</button></div>';
   }else{
     controls='<button data-promo-add="'+esc(p.id)+'">Agregar promoción'+(p.promotion_price!=null?" · "+money(p.promotion_price):"")+'</button>';
   }
   return '<article class="product-card" data-promo="'+esc(p.id)+'">'+
    (p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.title)+'">':'<div style="aspect-ratio:1/1;background:#eef2f7"></div>')+
    '<div class="body"><h3>'+esc(p.title)+'</h3><p class="muted">'+esc(subtitle||"")+'</p>'+price+controls+'</div></article>';
 }).join("");
 $("promotions").querySelectorAll("[data-promo-add]").forEach(b=>b.onclick=()=>{
   const p=promotions.find(x=>x.id===b.dataset.promoAdd),option=p?.items?.find(x=>x.id===b.dataset.option)||null;
   if(p){trackLocal("PROMOTION_VIEW",null,{promotion_id:p.id,title:p.title});addStandalonePromotion(p,option);}
 });
 $("promotions").querySelectorAll("[data-mix-minus]").forEach(b=>b.onclick=()=>{const p=promotions.find(x=>x.id===b.dataset.mixMinus);if(p)changePromotionMix(p,b.dataset.var,-1)});
 $("promotions").querySelectorAll("[data-mix-plus]").forEach(b=>b.onclick=()=>{const p=promotions.find(x=>x.id===b.dataset.mixPlus);if(p)changePromotionMix(p,b.dataset.var,1)});
 $("promotions").querySelectorAll("[data-mix-add]").forEach(b=>b.onclick=()=>{const p=promotions.find(x=>x.id===b.dataset.mixAdd);if(p){trackLocal("PROMOTION_VIEW",null,{promotion_id:p.id,title:p.title});addMixedPromotion(p);}});
}
async function loadMenu(){
 const mode=store.settings.catalog_mode;
 $("menuSection").classList.toggle("hidden",mode==="CARDS");
 $("productsSection").classList.toggle("hidden",mode==="VISUAL_MENU");
 if(mode==="CARDS")return;
 const {data,error}=await supabaseClient.rpc("public_local_menu_pages",{p_local_id:store.local.id});
 if(error){console.warn(error);return;}
 const rows=Array.isArray(data)?data:[];
 $("menuPages").innerHTML=rows.length?rows.map(x=>'<article class="menu-page"><strong>'+esc(x.title||"Menú")+'</strong><img src="'+esc(x.image_url||"")+'" alt=""></article>').join(""):'<div class="empty">Este LOCAL todavía no tiene hojas de menú visual.</div>';
}
async function init(){
 try{
   if(!key)throw new Error("No se especificó el LOCAL.");
   const {data,error}=await supabaseClient.rpc("public_local_storefront",{p_local_key:key});
   if(error)throw error;if(!data)throw new Error("Esta tienda no está disponible.");
   store=data;document.title=store.local.name+" | HTPWEB";
   document.body.classList.add("preset-"+store.settings.preset_code,"surface-"+store.settings.surface_style);
   applyStoreTheme();
   const [pRes,vRes,cRes,iRes,promoRes]=await Promise.all([
     supabaseClient.from("products").select("id,local_id,category_id,name,description,price,image_url,display_order,sku").eq("local_id",store.local.id).eq("active",true).eq("catalog_visible",true).order("display_order"),
     supabaseClient.from("product_variants").select("id,product_id,name,price,display_order").eq("active",true).order("display_order"),
     supabaseClient.from("categories").select("id,local_id,name,display_order").eq("local_id",store.local.id).eq("active",true).order("display_order"),
     supabaseClient.rpc("public_local_inventory",{p_local_id:store.local.id}),
     supabaseClient.rpc("public_local_promotions_catalog",{p_local_id:store.local.id})
   ]);
   if(pRes.error)throw pRes.error;if(cRes.error)throw cRes.error;
   products=pRes.data||[];const ids=new Set(products.map(p=>p.id));variants=(vRes.data||[]).filter(v=>ids.has(v.product_id));categories=cRes.data||[];inventory=Array.isArray(iRes.data)?iRes.data:[];promotions=Array.isArray(promoRes.data)?promoRes.data:[];
   renderHero();renderPageSections();renderCats();renderPromotions();renderProducts();await loadMenu();updateCount();
   trackLocal("LOCAL_VIEW",null,{preset:store.settings.preset_code});
   if(sharedProductId){
     const target=document.getElementById("product-"+sharedProductId);
     if(target){trackLocal("PRODUCT_VIEW",sharedProductId,{deep_link:true});target.scrollIntoView({behavior:"smooth",block:"center"});}
   }
   $("search").oninput=renderProducts;
   $("cartBtn").onclick=()=>{
     trackLocal("CART_VIEW",null,{action:"open"});
     if(source==="htpweb"){
       location.href="carrito-general.html";
       return;
     }
     const next=new URL("tienda-carrito.html",location.href);
     next.searchParams.set("local",key);if(source!=="direct")next.searchParams.set("src",source);if(campaign)next.searchParams.set("campaign",campaign);
     location.href=next.toString();
   };
 }catch(e){$("error").textContent=e.message||"No se pudo abrir la tienda.";$("error").classList.remove("hidden");}
}
init();
</script>
