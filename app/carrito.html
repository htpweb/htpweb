<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi carrito</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:bold}
.back{color:#fff;text-decoration:none}
main{max-width:800px;margin:auto;padding:15px}
h1{margin:5px 0 15px}
.item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.nombre{font-weight:bold}
.precio{color:#666;font-size:14px;margin-top:4px}
.controles{display:flex;align-items:center;gap:8px}
.controles button{border:0;width:32px;height:32px;border-radius:8px;background:#eee;font-size:18px;cursor:pointer}
.cantidad{min-width:25px;text-align:center;font-weight:bold}
.eliminar{border:0;background:none;color:#e53935;cursor:pointer;font-size:13px}
.total{background:#fff;border-radius:14px;padding:18px;margin-top:15px}
.total div{display:flex;justify-content:space-between;margin:7px 0}
.total strong{font-size:20px}
.vacio{background:#fff;padding:35px;text-align:center;border-radius:14px;color:#777}
.btn{width:100%;border:0;border-radius:10px;padding:13px;margin-top:15px;background:#e53935;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.formulario{background:#fff;border-radius:14px;padding:18px;margin-top:15px}
.formulario h2{margin:0 0 15px}
.campo{margin-bottom:13px}
.campo label{display:block;font-weight:bold;font-size:14px;margin-bottom:6px}
.campo input,.campo textarea{width:100%;border:1px solid #ddd;border-radius:9px;padding:11px;font:inherit}
.campo textarea{min-height:85px;resize:vertical}
.error{background:#fff;padding:25px;border-radius:14px;text-align:center;color:#c62828}
.exito{background:#fff;padding:30px;border-radius:14px;text-align:center}
.exito h2{color:#2e7d32}
@media(max-width:600px){
.item{align-items:flex-start;flex-direction:column}
.controles{width:100%}
}
</style>
</head>

<body>

<header>
<a class="back" id="volver" href="#">← Volver</a>
<div class="logo" id="logo">Cargando...</div>
</header>

<main>

<h1>Mi carrito</h1>

<section id="contenido">
<div class="vacio">Cargando...</div>
</section>

</main>

<script>

const $=id=>document.getElementById(id);

let carrito=[];
let pedidoId=null;

const params=new URLSearchParams(location.search);
pedidoId=params.get("pedido");

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));


async function iniciar(){

try{

if(!pedidoId)
throw new Error("No se especificó el carrito.");

negocio=await cargarNegocio();

$("logo").textContent=negocio.nombre;

$("volver").href=
`index.html?cliente=${encodeURIComponent(negocio.slug)}`;

await cargarCarrito();

}catch(e){

console.error(e);

$("contenido").innerHTML=
`<div class="error">${esc(e.message||"No se pudo cargar el carrito.")}</div>`;
}
}


/* CARGAR CARRITO */

async function cargarCarrito(){

const {data,error}=await supabaseClient.rpc(
"obtener_carrito",
{p_pedido_id:pedidoId}
);

if(error)
throw error;

carrito=data||[];

pintar();
}


/* PINTAR */

function pintar(){

if(!carrito.length){

$("contenido").innerHTML=
`<div class="vacio">Tu carrito está vacío.</div>`;

return;
}

let total=0;

$("contenido").innerHTML=
carrito.map(item=>{

total+=Number(item.subtotal||0);

return `
<article class="item">

<div>
<div class="nombre">${esc(item.nombre)}</div>
<div class="precio">
$${Number(item.precio||0).toFixed(2)} c/u
</div>
</div>

<div class="controles">

<button onclick="cambiarCantidad('${item.detalle_id}',${Number(item.cantidad)-1})">
−
</button>

<span class="cantidad">${item.cantidad}</span>

<button onclick="cambiarCantidad('${item.detalle_id}',${Number(item.cantidad)+1})">
+
</button>

<button class="eliminar" onclick="eliminarProducto('${item.detalle_id}')">
Eliminar
</button>

</div>

</article>`;

}).join("")+

`
<section class="total">

<div>
<span>Subtotal</span>
<strong>$${total.toFixed(2)}</strong>
</div>

<button class="btn" onclick="mostrarFormulario()">
Continuar pedido
</button>

</section>
`;
}


/* CANTIDAD */

async function cambiarCantidad(detalleId,cantidad){

try{

if(cantidad<=0){
await eliminarProducto(detalleId);
return;
}

const {error}=await supabaseClient.rpc(
"actualizar_cantidad_carrito",
{
p_detalle_id:detalleId,
p_cantidad:cantidad
});

if(error)
throw error;

await cargarCarrito();

}catch(e){

console.error(e);

alert(e.message||"No se pudo actualizar la cantidad.");
}
}


/* ELIMINAR */

async function eliminarProducto(detalleId){

try{

const {error}=await supabaseClient.rpc(
"eliminar_del_carrito",
{
p_detalle_id:detalleId
});

if(error)
throw error;

await cargarCarrito();

}catch(e){

console.error(e);

alert(e.message||"No se pudo eliminar el producto.");
}
}


/* FORMULARIO */

function mostrarFormulario(){

$("contenido").innerHTML=`

<section class="formulario">

<h2>Datos del pedido</h2>

<div class="campo">
<label for="nombre">Nombre</label>
<input
id="nombre"
type="text"
autocomplete="name"
placeholder="Tu nombre">
</div>

<div class="campo">
<label for="telefono">Teléfono</label>
<input
id="telefono"
type="tel"
autocomplete="tel"
placeholder="0989351622">
</div>

<div class="campo">
<label for="direccion">Dirección</label>
<input
id="direccion"
type="text"
autocomplete="street-address"
placeholder="Dirección de entrega">
</div>

<div class="campo">
<label for="observaciones">Observaciones</label>
<textarea
id="observaciones"
placeholder="Ej.: entregar en la puerta, sin cebolla, etc."></textarea>
</div>

<button
class="btn"
id="confirmar"
onclick="confirmarPedido()">
Confirmar pedido
</button>

</section>
`;
}


/* CONFIRMAR */

async function confirmarPedido(){

const nombre=$("nombre").value.trim();
const telefono=$("telefono").value.trim();
const direccion=$("direccion").value.trim();
const observaciones=$("observaciones").value.trim();

if(!nombre){
alert("Ingrese su nombre.");
return;
}

if(!telefono){
alert("Ingrese su teléfono.");
return;
}

if(!direccion){
alert("Ingrese la dirección de entrega.");
return;
}

const boton=$("confirmar");

boton.disabled=true;
boton.textContent="Confirmando...";

try{

const {data,error}=await supabaseClient.rpc(
"confirmar_pedido",
{
p_pedido_id:pedidoId,
p_nombre:nombre,
p_telefono:telefono,
p_direccion:direccion,
p_observaciones:observaciones||null
});

if(error)
throw error;

$("contenido").innerHTML=`

<section class="exito">

<h2>¡Pedido recibido!</h2>

<p>
Tu pedido fue registrado correctamente.
</p>

<p>
<strong>Número de pedido:</strong><br>
${esc(data)}
</p>

<button
class="btn"
onclick="volverInicio()">
Volver al inicio
</button>

</section>
`;

}catch(e){

console.error(e);

boton.disabled=false;
boton.textContent="Confirmar pedido";

alert(
e.message||
"No se pudo confirmar el pedido."
);
}
}


/* INICIO */

function volverInicio(){

location.href=
`index.html?cliente=${encodeURIComponent(negocio.slug)}`;
}


iniciar();

</script>

</body>
</html>
