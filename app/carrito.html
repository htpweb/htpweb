<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi carrito | HTPWEB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js"></script>
<script src="../config/auth.js"></script>
<script src="../config/addresses.js"></script>
<script src="../config/cart.js"></script>
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <div class="brand">Mi carrito</div>
      <small id="deliveryName"></small>
    </div>
    <button class="btn btn-light" id="backBtn">← Seguir comprando</button>
  </div>
</header>

<main>
  <div id="message" class="hidden"></div>

  <section class="card">
    <div id="cartList"></div>
    <div id="summary"></div>
  </section>

  <section id="checkoutCard" class="card hidden">
    <h2>Datos de entrega</h2>

    <label>Nombre</label>
    <input id="name" autocomplete="name">

    <label>Teléfono</label>
    <input id="phone" type="tel" autocomplete="tel">

    <div id="savedAddressBox" class="hidden">
      <h3>Direcciones guardadas</h3>
      <label>Usar una dirección</label>
      <select id="savedAddressSelect">
        <option value="">Nueva dirección</option>
      </select>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-muted hidden" id="deactivateAddressBtn" type="button">Desactivar dirección</button>
      </div>
    </div>

    <h3>Ubicación</h3>
    <button class="btn btn-muted" id="geoBtn" type="button">📍 Usar mi ubicación</button>
    <div id="map"></div>
    <small class="note" id="locationInfo">Selecciona un punto en el mapa y confírmalo.</small>
    <button class="btn btn-success hidden" id="acceptLocation" type="button">Aceptar ubicación</button>

    <label>Dirección</label>
    <input id="address" placeholder="Calle, número, sector">

    <label>Referencia</label>
    <input id="reference" placeholder="Casa, edificio, punto de referencia">

    <div class="save-address-panel">
      <h3>Guardar esta dirección</h3>
      <div class="form-grid">
        <div>
          <label>Nombre</label>
          <input id="addressLabel" placeholder="Ej. Casa, Trabajo, Mamá">
        </div>
        <div>
          <label class="row">
            <input id="addressDefault" type="checkbox" style="width:auto">
            Usar como dirección predeterminada
          </label>
        </div>
      </div>
      <button class="btn btn-muted" id="saveAddressBtn" type="button">Guardar dirección</button>
      <small class="note">La dirección guardada conservará el punto exacto del mapa para calcular el delivery.</small>
    </div>

    <label>Observaciones</label>
    <textarea id="notes" rows="3"></textarea>

    <label class="row">
      <input id="requiresInvoice" type="checkbox" style="width:auto">
      Necesito factura
    </label>

    <div id="invoiceFields" class="hidden">
      <label>Tipo de documento</label>
      <select id="documentType">
        <option value="">Seleccione</option>
        <option value="cedula">Cédula</option>
        <option value="ruc">RUC</option>
        <option value="pasaporte">Pasaporte</option>
      </select>

      <label>Número de documento</label>
      <input id="documentNumber">

      <label>Correo para factura</label>
      <input id="invoiceEmail" type="email">
    </div>

    <button class="btn btn-primary" style="width:100%;margin-top:14px" id="confirmBtn">
      Confirmar pedido
    </button>
  </section>

  <section id="successCard" class="card hidden"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[ch]));

let negocioActual = null;
let items = [];
let productMap = new Map();
let variantMap = new Map();
let localMap = new Map();
let savedAddresses = [];

let map = null;
let marker = null;
let latitude = null;
let longitude = null;
let locationAccepted = false;

async function init() {
  try {
    negocioActual = await cargarNegocio();
    $("deliveryName").textContent = negocioActual.name;
    $("backBtn").onclick = () => location.href = urlDelivery("index.html");

    await reloadCart();

    const user = await obtenerUsuarioActual();
    if (user) {
      $("invoiceEmail").value = user.email || "";
      const { data } = await supabaseClient
        .from("customers")
        .select("name,phone,email")
        .eq("profile_id", user.id)
        .eq("active", true)
        .maybeSingle();

      if (data) {
        $("name").value = data.name || "";
        $("phone").value = data.phone || "";
        if (data.email) $("invoiceEmail").value = data.email;
      }

      try {
        const { data: role } = await supabaseClient.rpc("current_role_code");
        if (role === "CLIENT") {
          await loadSavedAddresses();
        }
      } catch (addressError) {
        console.warn("No se pudieron cargar las direcciones guardadas.", addressError);
      }
    }
  } catch (e) {
    showMessage(e.message || "No se pudo cargar el carrito.");
  }
}

function showMessage(text, type = "error") {
  $("message").textContent = text;
  $("message").className = type === "success" ? "success" : "error";
}

async function reloadCart() {
  items = carritoObtener(negocioActual.slug);
  productMap = new Map();
  variantMap = new Map();
  localMap = new Map();

  if (!items.length) {
    renderCart();
    return;
  }

  const productIds = [...new Set(items.map(x => x.product_id))];
  const variantIds = [...new Set(items.map(x => x.variant_id).filter(Boolean))];
  const localIds = [...new Set(items.map(x => x.local_id))];

  const calls = [
    supabaseClient
      .from("products")
      .select("id,local_id,name,price,image_url,active")
      .in("id", productIds)
      .eq("active", true),

    supabaseClient
      .from("locals")
      .select("id,name,active")
      .in("id", localIds)
      .eq("active", true)
  ];

  if (variantIds.length) {
    calls.push(
      supabaseClient
        .from("product_variants")
        .select("id,product_id,name,price,active")
        .in("id", variantIds)
        .eq("active", true)
    );
  }

  const results = await Promise.all(calls);
  if (results[0].error) throw results[0].error;
  if (results[1].error) throw results[1].error;
  if (results[2]?.error) throw results[2].error;

  (results[0].data || []).forEach(x => productMap.set(x.id, x));
  (results[1].data || []).forEach(x => localMap.set(x.id, x));
  (results[2]?.data || []).forEach(x => variantMap.set(x.id, x));

  items = items.filter(item => {
    const product = productMap.get(item.product_id);
    if (!product || product.local_id !== item.local_id) return false;
    if (item.variant_id) {
      const variant = variantMap.get(item.variant_id);
      if (!variant || variant.product_id !== item.product_id) return false;
    }
    return true;
  });

  carritoGuardar(negocioActual.slug, items);
  renderCart();
}

function itemPrice(item) {
  const variant = item.variant_id ? variantMap.get(item.variant_id) : null;
  const product = productMap.get(item.product_id);
  return Number(variant?.price ?? product?.price ?? 0);
}

function renderCart() {
  if (!items.length) {
    $("cartList").innerHTML = '<div class="empty"><h2>Tu carrito está vacío</h2><p>Agrega productos para continuar.</p></div>';
    $("summary").innerHTML = "";
    $("checkoutCard").classList.add("hidden");
    return;
  }

  const grouped = new Map();
  items.forEach(item => {
    if (!grouped.has(item.local_id)) grouped.set(item.local_id, []);
    grouped.get(item.local_id).push(item);
  });

  let subtotal = 0;

  $("cartList").innerHTML = [...grouped.entries()].map(([localId, group]) => {
    const local = localMap.get(localId);
    let localSubtotal = 0;

    const body = group.map(item => {
      const product = productMap.get(item.product_id);
      const variant = item.variant_id ? variantMap.get(item.variant_id) : null;
      const price = itemPrice(item);
      const line = price * item.quantity;
      localSubtotal += line;
      subtotal += line;

      return `
        <div class="cart-item">
          <div>
            <strong>${esc(product?.name || "Producto")}</strong>
            ${variant ? `<div class="muted">${esc(variant.name)}</div>` : ""}
            <div>$${price.toFixed(2)} × ${item.quantity}</div>
          </div>
          <div class="qty">
            <button class="btn btn-muted" onclick="changeQty('${item.local_id}','${item.product_id}','${item.variant_id || ""}',${item.quantity - 1})">−</button>
            <strong>${item.quantity}</strong>
            <button class="btn btn-muted" onclick="changeQty('${item.local_id}','${item.product_id}','${item.variant_id || ""}',${item.quantity + 1})">+</button>
            <button class="btn btn-danger" onclick="removeItem('${item.local_id}','${item.product_id}','${item.variant_id || ""}')">×</button>
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="cart-group">
        <h3>${esc(local?.name || "Local")}</h3>
        ${body}
        <div class="summary-line"><span>Subtotal referencial</span><strong>$${localSubtotal.toFixed(2)}</strong></div>
      </div>
    `;
  }).join("");

  $("summary").innerHTML = `
    <div class="summary-line"><span>Productos (referencial)</span><strong>$${subtotal.toFixed(2)}</strong></div>
    <div class="summary-line"><span>Delivery</span><span>Se calcula en el servidor</span></div>
    <small class="note">Los precios, distancias, tarifa y total definitivos se vuelven a validar al confirmar.</small>
    <button class="btn btn-dark" style="width:100%;margin-top:14px" onclick="openCheckout()">Continuar</button>
    <button class="btn btn-danger" style="width:100%;margin-top:8px" onclick="emptyCart()">Vaciar carrito</button>
  `;
}

function matcher(localId, productId, variantId) {
  return {
    local_id: localId,
    product_id: productId,
    variant_id: variantId || null
  };
}

function changeQty(localId, productId, variantId, quantity) {
  if (quantity <= 0) return removeItem(localId, productId, variantId);
  carritoCambiarCantidad(negocioActual.slug, matcher(localId, productId, variantId), quantity);
  reloadCart();
}

function removeItem(localId, productId, variantId) {
  carritoEliminar(negocioActual.slug, matcher(localId, productId, variantId));
  reloadCart();
}

function emptyCart() {
  if (!confirm("¿Vaciar todo el carrito?")) return;
  carritoVaciar(negocioActual.slug);
  reloadCart();
}

async function openCheckout() {
  if (!items.length) return;

  const user = await obtenerUsuarioActual();
  if (!user) {
    irAAcceso(rutaActualRelativa());
    return;
  }

  $("checkoutCard").classList.remove("hidden");
  if (!map) initMap();

  const selected = $("savedAddressSelect")?.value || "";
  if (selected) {
    applySavedAddress(selected);
  }

  setTimeout(() => map?.invalidateSize(), 100);
  $("checkoutCard").scrollIntoView({ behavior: "smooth" });
}

async function loadSavedAddresses(preferredId = null) {
  savedAddresses = await listarMisDireccionesCliente({ soloActivas: true });

  const select = $("savedAddressSelect");
  const box = $("savedAddressBox");
  if (!select || !box) return;

  box.classList.remove("hidden");

  select.innerHTML =
    '<option value="">Nueva dirección</option>' +
    savedAddresses.map(address => {
      const suffix = address.is_default ? " — predeterminada" : "";
      return `<option value="${address.id}">${esc(address.label)}${suffix}</option>`;
    }).join("");

  const preferred = preferredId
    ? savedAddresses.find(address => address.id === preferredId)
    : savedAddresses.find(address => address.is_default);

  if (preferred) {
    select.value = preferred.id;
  }

  syncSavedAddressButtons();
}

function selectedSavedAddress() {
  const id = $("savedAddressSelect")?.value || "";
  return savedAddresses.find(address => address.id === id) || null;
}

function syncSavedAddressButtons() {
  const selected = selectedSavedAddress();
  $("deactivateAddressBtn")?.classList.toggle("hidden", !selected);
  $("saveAddressBtn").textContent = selected ? "Actualizar dirección" : "Guardar dirección";

  if (selected) {
    $("addressLabel").value = selected.label || "";
    $("addressDefault").checked = Boolean(selected.is_default);
  } else {
    $("addressLabel").value = "";
    $("addressDefault").checked = false;
  }
}

function applySavedAddress(addressId) {
  const saved = savedAddresses.find(address => address.id === addressId);
  if (!saved) return;

  $("address").value = saved.address || "";
  $("reference").value = saved.reference || "";
  $("addressLabel").value = saved.label || "";
  $("addressDefault").checked = Boolean(saved.is_default);

  if (saved.latitude !== null && saved.longitude !== null) {
    setLocation(Number(saved.latitude), Number(saved.longitude));
    locationAccepted = true;
    $("locationInfo").textContent = `✓ Dirección guardada: ${Number(saved.latitude).toFixed(6)}, ${Number(saved.longitude).toFixed(6)}`;
    $("acceptLocation").classList.add("hidden");
  } else {
    latitude = null;
    longitude = null;
    locationAccepted = false;
    $("locationInfo").textContent = "Esta dirección no tiene coordenadas guardadas. Selecciona un punto en el mapa.";
  }

  syncSavedAddressButtons();
}

async function saveCurrentAddress() {
  try {
    const addressText = $("address").value.trim();
    const label = $("addressLabel").value.trim();

    if (!label) throw new Error("Escribe un nombre para la dirección.");
    if (!addressText) throw new Error("Escribe la dirección.");
    if (!locationAccepted || latitude === null || longitude === null) {
      throw new Error("Selecciona y acepta la ubicación antes de guardar.");
    }

    const current = selectedSavedAddress();

    const saved = await guardarMiDireccionCliente({
      id: current?.id || null,
      label,
      address: addressText,
      reference: $("reference").value.trim() || null,
      latitude,
      longitude,
      isDefault: $("addressDefault").checked,
      active: true
    });

    await loadSavedAddresses(saved?.id || current?.id || null);
    showMessage(current ? "Dirección actualizada." : "Dirección guardada.", "success");
  } catch (e) {
    showMessage(e.message || "No se pudo guardar la dirección.");
  }
}

async function deactivateSelectedAddress() {
  const current = selectedSavedAddress();
  if (!current) return;

  if (!confirm(`¿Desactivar la dirección "${current.label}"?`)) return;

  try {
    await desactivarMiDireccionCliente(current);
    await loadSavedAddresses();
    $("savedAddressSelect").value = "";
    syncSavedAddressButtons();
    showMessage("Dirección desactivada.", "success");
  } catch (e) {
    showMessage(e.message || "No se pudo desactivar la dirección.");
  }
}

function initMap() {
  map = L.map("map").setView([0.95, -79.65], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
  }).addTo(map);

  map.on("click", e => setLocation(e.latlng.lat, e.latlng.lng));
}

function setLocation(lat, lng) {
  latitude = Number(lat);
  longitude = Number(lng);
  locationAccepted = false;

  if (marker) marker.setLatLng([latitude, longitude]);
  else {
    marker = L.marker([latitude, longitude], { draggable: true }).addTo(map);
    marker.on("dragend", e => {
      const p = e.target.getLatLng();
      setLocation(p.lat, p.lng);
    });
  }

  map.setView([latitude, longitude], 17);
  $("locationInfo").textContent = `Ubicación seleccionada: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
  $("acceptLocation").classList.remove("hidden");
}

$("savedAddressSelect").onchange = () => {
  const id = $("savedAddressSelect").value;
  if (id) {
    applySavedAddress(id);
  } else {
    syncSavedAddressButtons();
  }
};

$("saveAddressBtn").onclick = saveCurrentAddress;
$("deactivateAddressBtn").onclick = deactivateSelectedAddress;

$("geoBtn").onclick = () => {
  if (!navigator.geolocation) {
    return showMessage("Tu navegador no permite geolocalización.");
  }

  navigator.geolocation.getCurrentPosition(
    pos => setLocation(pos.coords.latitude, pos.coords.longitude),
    () => showMessage("No fue posible obtener tu ubicación. Puedes marcarla en el mapa."),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
};

$("acceptLocation").onclick = async () => {
  if (latitude === null || longitude === null) return;

  locationAccepted = true;
  $("locationInfo").textContent = `✓ Ubicación aceptada: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
  $("acceptLocation").classList.add("hidden");

  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(latitude)}&lon=${encodeURIComponent(longitude)}&zoom=18&addressdetails=1`;
    const response = await fetch(url, { headers: { Accept: "application/json" } });
    if (response.ok) {
      const data = await response.json();
      if (data.display_name && !$("address").value.trim()) {
        $("address").value = data.display_name;
      }
    }
  } catch (e) {
    console.warn(e);
  }
};

$("requiresInvoice").onchange = () => {
  $("invoiceFields").classList.toggle("hidden", !$("requiresInvoice").checked);
};

$("confirmBtn").onclick = confirmOrder;

async function confirmOrder() {
  const button = $("confirmBtn");

  try {
    if (!items.length) throw new Error("El carrito está vacío.");

    const user = await obtenerUsuarioActual();
    if (!user) {
      irAAcceso(rutaActualRelativa());
      return;
    }

    const name = $("name").value.trim();
    const phone = $("phone").value.trim();
    const address = $("address").value.trim();

    if (!name) throw new Error("Ingresa tu nombre.");
    if (!phone) throw new Error("Ingresa tu teléfono.");
    if (!address) throw new Error("Ingresa la dirección.");
    if (!locationAccepted || latitude === null || longitude === null) {
      throw new Error("Selecciona y acepta la ubicación de entrega.");
    }

    const requiresInvoice = $("requiresInvoice").checked;
    const documentType = $("documentType").value.trim();
    const documentNumber = $("documentNumber").value.trim();
    const invoiceEmail = $("invoiceEmail").value.trim();

    if (requiresInvoice && (!documentType || !documentNumber || !invoiceEmail)) {
      throw new Error("Completa los datos de facturación.");
    }

    button.disabled = true;
    button.textContent = "Confirmando pedido...";

    await asegurarCustomerActual({
      name,
      phone,
      email: user.email || invoiceEmail || ""
    });

    const locals = [...new Set(items.map(item => item.local_id))]
      .map(local_id => ({ local_id }));

    const orderItems = items.map(item => ({
      local_id: item.local_id,
      product_id: item.product_id,
      variant_id: item.variant_id || null,
      quantity: item.quantity
    }));

    const { data, error } = await supabaseClient.functions.invoke("crear-pedido", {
      body: {
        delivery_id: negocioActual.id,
        delivery_address: address,
        latitude,
        longitude,
        address_reference: $("reference").value.trim() || null,
        requires_invoice: requiresInvoice,
        document_type: requiresInvoice ? documentType : null,
        document_number: requiresInvoice ? documentNumber : null,
        invoice_email: requiresInvoice ? invoiceEmail : null,
        notes: $("notes").value.trim() || null,
        locals,
        items: orderItems
      }
    });

    if (error) {
      let detail = data?.error || data?.message || "";

      if (!detail && error?.context) {
        try {
          const response = typeof error.context.clone === "function"
            ? error.context.clone()
            : error.context;
          const payload = await response.json();
          detail = payload?.error || payload?.message || "";
        } catch (parseError) {
          console.warn("No se pudo leer el detalle devuelto por crear-pedido.", parseError);
        }
      }

      throw new Error(detail || error.message || "No se pudo crear el pedido.");
    }

    if (!data?.ok || !data?.order?.id) {
      throw new Error(data?.error || "El servidor no devolvió un pedido válido.");
    }

    carritoVaciar(negocioActual.slug);
    items = [];
    $("checkoutCard").classList.add("hidden");
    $("cartList").innerHTML = "";
    $("summary").innerHTML = "";

    $("successCard").innerHTML = `
      <div class="success">
        <h2>✅ Pedido creado</h2>
        <p><strong>ID:</strong> ${esc(data.order.id)}</p>
        <p><strong>Subtotal:</strong> $${Number(data.order.subtotal || 0).toFixed(2)}</p>
        <p><strong>Delivery:</strong> $${Number(data.order.delivery_fee || 0).toFixed(2)}</p>
        <p class="total"><strong>Total:</strong> $${Number(data.order.total || 0).toFixed(2)}</p>
      </div>
      <button class="btn btn-dark" onclick="location.href=urlDelivery('index.html')">Volver a comprar</button>
    `;
    $("successCard").classList.remove("hidden");
    showMessage("Pedido registrado correctamente.", "success");
  } catch (e) {
    console.error(e);
    showMessage(e.message || "No se pudo confirmar el pedido.");
  } finally {
    button.disabled = false;
    button.textContent = "Confirmar pedido";
  }
}

init();
</script>
</body>
</html>
