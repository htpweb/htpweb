<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DELIVERY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js?v=20261001-brand1"></script>
<script src="../config/auth.js"></script>
<script src="../config/cart.js"></script>
<script src="../config/ads.js"></script>
<link rel="stylesheet" href="../assets/app.css?v=20261002-promo1">
</head>
<body>
<header>
  <div class="header-row">
    <div class="delivery-brand-shell">
      <div class="delivery-brand-logo-frame">
        <img id="deliveryLogo" class="delivery-brand-logo hidden" alt="">
        <span id="deliveryLogoFallback" class="delivery-brand-fallback">D</span>
      </div>
      <div class="delivery-brand-copy">
        <div class="brand" id="brand">DELIVERY</div>
        <div class="delivery-platform-signature" id="platformBrand">by HTPWEB</div>
      </div>
    </div>
    <div class="header-actions">
      <a class="btn btn-light" id="ordersLink" href="#">Mis pedidos</a>
      <a class="btn btn-light" id="authLink" href="#">Acceder</a>
      <a class="btn btn-primary" id="cartLink" href="#">🛒 <span id="cartCount">0</span></a>
    </div>
  </div>
</header>

<main>
  <section class="card hero">
    <h1 id="title">Cargando...</h1>
    <p id="subtitle">Explora locales y productos.</p>
    <input id="search" class="search" placeholder="Buscar local o producto...">
  </section>

  <section class="card">
    <h2>Categorías</h2>
    <div id="categories" class="chips"></div>
  </section>

  <section class="promo-strip-section" id="deliveryPromotionsCard">
    <div class="row between promo-strip-head">
      <div>
        <h2>🔥 Promociones para hoy</h2>
        <p id="deliveryPromotionsDate" class="muted">Cargando promociones...</p>
      </div>
      <select id="promotionDayOffset" class="promo-day-select">
        <option value="0">Hoy</option>
        <option value="1">Mañana</option>
        <option value="2">En 2 días</option>
        <option value="3">En 3 días</option>
        <option value="4">En 4 días</option>
        <option value="5">En 5 días</option>
        <option value="6">En 6 días</option>
        <option value="7">En 7 días</option>
      </select>
    </div>
    <div id="deliveryPromotionsList" class="promo-strip"></div>
  </section>

  <section>
    <h2>Locales</h2>
    <div id="locals" class="grid"></div>
  </section>

  <div id="error" class="error hidden"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[ch]));

let negocioActual = null;
let locals = [];
let categories = [];
let localCategoryAssignments = [];
let products = [];
let deliveryPromotions = [];
let availabilityByLocal = new Map();
let categoryId = "";

async function init() {
  try {
    negocioActual = await cargarNegocio();

    htpApplyDeliveryBrand(negocioActual);
    $("title").textContent = "¿Qué quieres pedir?";
    $("subtitle").textContent = negocioActual.description || `Explora los locales disponibles en ${negocioActual.name}.`;
    $("cartLink").href = urlDelivery("carrito.html");
    $("ordersLink").href = urlDelivery("pedidos.html");
    updateCartCount();

    const user = await obtenerUsuarioActual();
    $("authLink").textContent = user ? "Mi cuenta" : "Acceder";
    $("authLink").href = user
      ? urlDelivery("acceso.html", { return: "index.html?delivery=" + encodeURIComponent(negocioActual.slug) })
      : urlDelivery("acceso.html", { return: "index.html?delivery=" + encodeURIComponent(negocioActual.slug) });

    await loadCatalog();
    await loadDeliveryPromotions();
    renderCategories();
    renderLocals();
  } catch (error) {
    console.error(error);
    $("error").textContent = error.message || "No se pudo cargar el delivery.";
    $("error").classList.remove("hidden");
  }
}

async function loadCatalog() {
  const [relationsRes, zonesRes] = await Promise.all([
    supabaseClient
      .from("local_deliveries")
      .select("local_id")
      .eq("delivery_id", negocioActual.id)
      .eq("active", true),

    supabaseClient
      .from("delivery_zones")
      .select("zone_id")
      .eq("delivery_id", negocioActual.id)
      .eq("active", true)
  ]);

  if (relationsRes.error) throw relationsRes.error;
  if (zonesRes.error) throw zonesRes.error;

  const linkedIds = [...new Set((relationsRes.data || []).map(x => x.local_id))];
  const zoneIds = [...new Set((zonesRes.data || []).map(x => x.zone_id))];

  if (!linkedIds.length || !zoneIds.length) {
    locals = [];
    categories = [];
    localCategoryAssignments = [];
    products = [];
    availabilityByLocal = new Map();
    return;
  }

  const localsRes = await supabaseClient
    .from("locals")
    .select("id,name,description,banner_url,logo_url,address,zone_id,active")
    .in("id", linkedIds)
    .in("zone_id", zoneIds)
    .eq("active", true)
    .order("name");

  if (localsRes.error) throw localsRes.error;

  locals = localsRes.data || [];
  const ids = locals.map(local => local.id);

  if (!ids.length) {
    categories = [];
    localCategoryAssignments = [];
    products = [];
    availabilityByLocal = new Map();
    return;
  }

  const [catsRes, assignmentsRes, productsRes] = await Promise.all([
    supabaseClient
      .from("local_business_categories")
      .select("id,name,description,active")
      .eq("active", true),

    supabaseClient
      .from("local_business_category_assignments")
      .select("local_id,category_id,position")
      .in("local_id", ids),

    supabaseClient
      .from("products")
      .select("id,local_id,category_id,name,description,price,image_url,display_order,active,catalog_visible")
      .in("local_id", ids)
      .eq("active", true)
      .eq("catalog_visible", true)
      .order("display_order")
      .order("name")
  ]);

  if (catsRes.error) throw catsRes.error;
  if (assignmentsRes.error) throw assignmentsRes.error;
  if (productsRes.error) throw productsRes.error;

  categories = catsRes.data || [];
  localCategoryAssignments = assignmentsRes.data || [];
  products = productsRes.data || [];

  try {
    const { data: availabilityData, error: availabilityError } = await supabaseClient.rpc(
      "public_locals_order_availability",
      { p_local_ids: ids }
    );

    if (availabilityError) throw availabilityError;

    availabilityByLocal = new Map(
      (availabilityData || []).map(row => [row.local_id, row])
    );
  } catch (availabilityError) {
    console.warn("No se pudo cargar la disponibilidad de locales:", availabilityError);
    availabilityByLocal = new Map();
  }
}

async function loadDeliveryPromotions() {
  const offset = Math.max(0, Math.min(30, Number.parseInt($("promotionDayOffset")?.value || "0", 10) || 0));
  const { data, error } = await supabaseClient.rpc("public_delivery_promotions", {
    p_delivery_id: negocioActual.id,
    p_day_offset: offset
  });
  if (error) throw error;

  const coveredLocalIds = new Set(locals.map(local => local.id));
  deliveryPromotions = (Array.isArray(data?.promotions) ? data.promotions : [])
    .filter(promotion => coveredLocalIds.has(promotion.local_id));
  const targetDate = data?.target_date
    ? new Date(String(data.target_date) + "T12:00:00").toLocaleDateString("es-EC", {
        weekday: "long", day: "numeric", month: "long"
      })
    : "día seleccionado";

  $("deliveryPromotionsDate").textContent =
    (offset === 0 ? "Hoy · " : offset === 1 ? "Mañana · " : "") + targetDate;

  $("deliveryPromotionsList").innerHTML = deliveryPromotions.length
    ? deliveryPromotions.map(promotion => {
        const items = Array.isArray(promotion.items) ? promotion.items : [];
        const isOptions = promotion.promotion_type === "OPTIONS";
        const itemHtml = "";

        let total = "";
        if (promotion.promotion_price !== null && promotion.promotion_price !== undefined) {
          total = '<div class="promotion-total">$' + Number(promotion.promotion_price).toFixed(2) + '</div>';
        } else if (isOptions) {
          const prices = items
            .map(item => Number(item.promo_price))
            .filter(Number.isFinite);
          if (prices.length) {
            total = '<div class="promotion-total">Desde $' + Math.min(...prices).toFixed(2) + '</div>';
          }
        }

        const image = promotion.image_url
          ? '<img src="' + esc(promotion.image_url) + '" alt="' + esc(promotion.title) + '">'
          : "";
        const typeLabel = isOptions ? "Opciones" : "Combo";
        const canBuyNow = offset === 0 && promotion.available_now === true && items.length > 0;
        const actionLabel = canBuyNow ? "Ver y comprar" : "Ver LOCAL";
        const extra = canBuyNow
          ? "{local:'" + esc(promotion.local_id) + "',promotion:'" + esc(promotion.id) + "'}"
          : "{local:'" + esc(promotion.local_id) + "'}";

        return '<article class="promotion-card promo-strip-card">' + image +
          '<div class="promotion-card-copy">' +
            '<span class="promotion-badge">PROMO · ' + esc(typeLabel) + '</span>' +
            '<strong>' + esc(promotion.title) + '</strong>' +
            '<div class="muted promo-local-name">' + esc(promotion.local_name || "") + '</div>' +
            total + itemHtml +
            '<button class="btn ' + (canBuyNow ? 'btn-primary' : 'btn-dark') + ' promo-action" ' +
              'onclick="location.href=urlDelivery(\'local.html\',' + extra + ')">' + actionLabel + '</button>' +
          '</div></article>';
      }).join("")
    : '<div class="empty">No hay promociones publicadas para este día.</div>';
}

function renderCategories() {
  const categoryOrder = [
    "Desayunos y Cafeterías",
    "Comida rápida",
    "Parrilladas y asados",
    "Pizzerías",
    "Mariscos y ceviche",
    "Almuerzos y comida típica",
    "Postres y heladería",
    "Bebidas alcohólicas",
    "Bebidas no alcohólicas",
    "Restaurantes"
  ];
  const order = new Map(categoryOrder.map((name, index) => [name, index]));
  const visible = categories
    .filter(c => order.has(c.name))
    .sort((a, b) => (order.get(a.name) ?? 999) - (order.get(b.name) ?? 999));

  $("categories").innerHTML =
    `<button class="chip ${!categoryId ? "active" : ""}" onclick="selectCategory('')">Todos</button>` +
    visible.map(c =>
      `<button class="chip ${categoryId === c.id ? "active" : ""}" onclick="selectCategory('${c.id}')">${esc(c.name)}</button>`
    ).join("");
}

function selectCategory(id) {
  categoryId = id;
  renderCategories();
  renderLocals();
}

function availabilityText(localId) {
  const availability = availabilityByLocal.get(localId);
  if (!availability) return null;

  if (availability.is_open === true) {
    if (availability.reason === "NO_SCHEDULE_CONFIGURED") {
      return { text: "Disponible", className: "availability-open" };
    }

    return {
      text: availability.closing_time
        ? `Abierto hasta ${availability.closing_time}`
        : "Abierto",
      className: "availability-open"
    };
  }

  if (availability.reason === "BEFORE_OPENING" && availability.opening_time) {
    return {
      text: `Abre a las ${availability.opening_time}`,
      className: "availability-closed"
    };
  }

  if (availability.reason === "CLOSED_TODAY") {
    return { text: "Cerrado hoy", className: "availability-closed" };
  }

  return { text: "Cerrado", className: "availability-closed" };
}

function normalizeSearchText(value) {
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function syncSearchMode() {
  const searching = Boolean(normalizeSearchText($("search").value));
  $("deliveryPromotionsCard").classList.toggle("hidden", searching);
}

function renderLocals() {
  const rawQuery = $("search").value;
  const q = normalizeSearchText(rawQuery);
  syncSearchMode();

  const filtered = locals.filter(local => {
    const ps = products.filter(p => p.local_id === local.id);
    const categoryMatch = !categoryId || localCategoryAssignments.some(a =>
      a.local_id === local.id && a.category_id === categoryId
    );
    const textMatch = !q || [
      local.name,
      local.description,
      local.address,
      ...ps.map(p => p.name),
      ...ps.map(p => p.description)
    ].some(v => normalizeSearchText(v).includes(q));

    // Cuando el usuario escribe una búsqueda, esta debe ser global y no quedar
    // bloqueada por una categoría seleccionada previamente.
    return q ? textMatch : categoryMatch;
  });

  $("locals").innerHTML = filtered.length ? filtered.map(local => {
    let ps = products.filter(p => p.local_id === local.id);
    if (q) {
      const matchingProducts = ps.filter(p =>
        normalizeSearchText(p.name + " " + (p.description || "")).includes(q)
      );
      // Si el nombre/descripción del local coincide pero no un producto concreto,
      // conserva sus productos principales para que la tarjeta no quede vacía.
      if (matchingProducts.length) ps = matchingProducts;
    }

    const availability = availabilityText(local.id);

    return `
      <article class="local-card">
        <div class="cover">${local.banner_url ? `<img src="${esc(local.banner_url)}" alt="${esc(local.name)}">` : ""}</div>
        <div class="pad">
          <div class="row between">
            <h3>${esc(local.name)}</h3>
            ${availability ? `<span class="availability-badge ${availability.className}">${esc(availability.text)}</span>` : ""}
          </div>
          <p class="muted">${esc(local.description || "")}</p>
          ${ps.slice(0,3).map(p => `
            <div class="summary-line">
              <span>${esc(p.name)}</span>
              <strong>$${Number(p.price || 0).toFixed(2)}</strong>
            </div>
          `).join("")}
          <button class="btn btn-dark" style="width:100%;margin-top:12px"
            onclick="location.href=urlDelivery('local.html',{local:'${local.id}'})">
            Ver productos
          </button>
        </div>
      </article>
    `;
  }).join("") : '<div class="card empty">No encontramos locales para esta búsqueda.</div>';
}

function updateCartCount() {
  $("cartCount").textContent = carritoCantidad(negocioActual.slug);
}

$("search").addEventListener("input", renderLocals);
$("promotionDayOffset").addEventListener("change", () => {
  loadDeliveryPromotions().catch(error => {
    console.error(error);
    $("deliveryPromotionsList").innerHTML = '<div class="empty">No se pudieron cargar las promociones.</div>';
  });
});
window.addEventListener("htpweb:cart", updateCartCount);
init();
</script>
</body>
</html>
