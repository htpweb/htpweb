```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cargando...</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.logo{font-size:21px;font-weight:800}.cart{color:#fff;text-decoration:none;background:#e53935;padding:9px 13px;border-radius:9px;font-weight:bold}
main{max-width:1100px;margin:auto;padding:18px}
.hero{background:#111;color:#fff;border-radius:16px;padding:24px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#ccc}
.search{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin:18px 0;background:#fff}
h2{font-size:20px;margin:18px 0 12px}
.categorias{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}
.cat{border:1px solid #ddd;background:#fff;border-radius:20px;padding:10px 15px;white-space:nowrap;cursor:pointer}
.cat.activa{background:#e53935;color:#fff;border-color:#e53935}
.locales{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.local{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 9px #0001;cursor:pointer}
.banner{height:150px;background:#ddd;position:relative}
.banner img{width:100%;height:100%;object-fit:cover}
.info{padding:14px}
.info h3{margin:0 0 5px}
.categoria{font-size:12px;color:#e53935;font-weight:bold}
.desc{color:#666;font-size:14px;margin:7px 0}
.prod{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:8px 0;font-size:13px}
.prod b{color:#111}
.vacio{text-align:center;background:#fff;padding:30px;border-radius:14px;color:#777}
.error{max-width:600px;margin:60px auto;padding:25px;background:#fff;border-radius:15px;text-align:center}
@media(max-width:600px){
main{padding:12px}.hero{padding:19px}.hero h1{font-size:24px}
}
</style>
</head>

<body>

<header>
<div class="logo" id="logo">Cargando...</div>
<a class="cart" id="carrito" href="#">🛒 <span id="cartCount">0</span></a>
</header>

<main id="contenido" style="display:none">

<section class="hero">
<h1 id="titulo">¿Qué quieres pedir?</h1>
<p id="subtitulo">Encuentra locales y productos.</p>
<input id="busqueda" class="search" placeholder="Buscar local o producto...">
</section>

<h2>Categorías</h2>
<div id="categorias" class="categorias"></div>

<h2>Locales</h2>
<div id="locales" class="locales"></div>

</main>

<div id="error" class="error" style="display:none"></div>

<script>
const $=id=>document.getElementById(id);

let locales=[];
let categorias=[];
let productos=[];
let categoriaActual="";
let negocioActual=null;
let pedidoId=null;

const params=new URLSearchParams(location.search);
pedidoId=params.get("pedido");

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

async function cargar(){
try{
negocio=await cargarNegocio();
negocioActual=negocio;

document.title=negocio.nombre;
$("logo").textContent=negocio.nombre;
$("titulo").textContent="¿Qué quieres pedir?";
$("subtitulo").textContent=`Encuentra locales y productos de ${negocio.nombre}.`;

const[localesRes,categoriasRes,productosRes]=await Promise.all([

supabaseClient
.from("locales")
.select("id,cliente_id,nombre,categoria,descripcion,banner_url,activo")
.eq("cliente_id",negocio.id)
.eq("activo",true)
.order("nombre"),

supabaseClient
.from("categorias")
.select("id,cliente_id,nombre,imagen_url,activo")
.eq("cliente_id",negocio.id)
.eq("activo",true)
.order("nombre"),

supabaseClient
.from("productos")
.select("id,cliente_id,local_id,categoria_id,nombre,descripcion,precio,imagen_url,activo")
.eq("cliente_id",negocio.id)
.eq("activo",true)
.order("nombre")
]);

if(localesRes.error)throw localesRes.error;
if(categoriasRes.error)throw categoriasRes.error;
if(productosRes.error)throw productosRes.error;

locales=localesRes.data||[];
categorias=categoriasRes.data||[];
productos=productosRes.data||[];

await prepararCarrito();

renderCategorias();
renderLocales();

$("contenido").style.display="block";

}catch(e){
console.error(e);
$("error").style.display="block";
$("error").textContent=e.message||"No se pudo cargar el negocio.";
}
}

async function prepararCarrito(){

if(!pedidoId){

const{data,error}=await supabaseClient.rpc(
"obtener_carrito_activo",
{p_cliente_id:negocioActual.id}
);

if(!error&&data)pedidoId=data;
}

actualizarEnlaceCarrito();
}

function actualizarEnlaceCarrito(){

$("carrito").href=
pedidoId
?`carrito.html?pedido=${encodeURIComponent(pedidoId)}&cliente=${encodeURIComponent(negocioActual.slug)}`
:`carrito.html?cliente=${encodeURIComponent(negocioActual.slug)}`;

if(!pedidoId){
$("cartCount").textContent="0";
return;
}

supabaseClient.rpc(
"obtener_carrito",
{p_pedido_id:pedidoId}
).then(({data,error})=>{

if(error)return;

const cantidad=(data||[]).reduce(
(s,i)=>s+Number(i.cantidad||0),0
);

$("cartCount").textContent=cantidad;

});
}

function seleccionarCategoria(c){
categoriaActual=c;
$("busqueda").value="";
renderCategorias();
renderLocales();
}

function renderCategorias(){

const q=$("busqueda").value.trim();

$("categorias").innerHTML=
`<button class="cat ${!categoriaActual&&!q?"activa":""}"
onclick="seleccionarCategoria('')">Todos</button>`+
categorias.map(c=>
`<button class="cat ${categoriaActual===c.nombre&&!q?"activa":""}"
onclick="seleccionarCategoria('${esc(c.nombre).replace(/'/g,"\\'")}')">
${esc(c.nombre)}
</button>`
).join("");
}

function renderLocales(){

const q=$("busqueda").value.trim().toLowerCase();

let lista=locales.filter(l=>{

const ps=productos.filter(p=>p.local_id===l.id);

if(q){
return(
l.nombre.toLowerCase().includes(q)||
(l.categoria||"").toLowerCase().includes(q)||
(l.descripcion||"").toLowerCase().includes(q)||
ps.some(p=>
(p.nombre+" "+(p.descripcion||""))
.toLowerCase().includes(q)
)
);
}

return !categoriaActual||l.categoria===categoriaActual;
});

$("locales").innerHTML=lista.length
?lista.map(l=>{

const ps=productos.filter(p=>{
if(p.local_id!==l.id)return false;
return(
!q||
p.nombre.toLowerCase().includes(q)||
(p.descripcion||"").toLowerCase().includes(q)
);
}).slice(0,3);

return`
<article class="local"
onclick="abrirLocal('${encodeURIComponent(l.id)}')">

<div class="banner">
${l.banner_url
?`<img src="${esc(l.banner_url)}" alt="${esc(l.nombre)}">`
:""}
</div>

<div class="info">

${l.categoria
?`<div class="categoria">${esc(l.categoria)}</div>`
:""}

<h3>${esc(l.nombre)}</h3>

<div class="desc">
${esc(l.descripcion||"")}
</div>

${ps.map(p=>`
<div class="prod">
<span>${esc(p.nombre)}</span>
<b>$${Number(p.precio||0).toFixed(2)}</b>
</div>
`).join("")}

</div>
</article>`;

}).join("")
:'<div class="vacio">No encontramos resultados.</div>';

renderCategorias();
}

function abrirLocal(id){

let url=
`local.html?id=${id}&cliente=${encodeURIComponent(negocioActual.slug)}`;

if(pedidoId){
url+=`&pedido=${encodeURIComponent(pedidoId)}`;
}

location.href=url;
}

$("busqueda").addEventListener("input",()=>{
renderCategorias();
renderLocales();
});

cargar();
</script>

</body>
</html>
