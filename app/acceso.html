<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso MASTER | HTPWEB</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/supabase.js"></script><link rel="stylesheet" href="../assets/app.css"></head><body><main style="max-width:430px;margin:8vh auto;padding:24px"><h1>HTPWEB MASTER</h1><p>Ingresa con tu correo y contraseña.</p><form id="login"><label for="email">Correo electrónico</label><input type="email" id="email" autocomplete="username" required><label for="password">Contraseña</label><input type="password" id="password" autocomplete="current-password" required><button type="submit" class="btn btn-primary">Ingresar</button></form><button id="recover" class="btn btn-muted" type="button">Recuperar contraseña</button><p id="feedback" role="status"></p></main><script>(()=>{const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get("return");const safeReturn=next&&new URL(next,location.href).origin===location.origin?next:"../admin/index.html";$("login").onsubmit=async e=>{e.preventDefault();$("feedback").textContent="Verificando acceso…";const {error}=await supabaseClient.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("feedback").textContent=error.message;return}const {data,error:roleError}=await supabaseClient.rpc("current_role_code");if(roleError||data!=="MASTER"){await supabaseClient.auth.signOut();$("feedback").textContent="Este acceso está reservado a MASTER.";return}location.href=safeReturn};$("recover").onclick=async()=>{const email=$("email").value.trim();if(!email){$("feedback").textContent="Escribe tu correo para recuperar el acceso.";return}const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:new URL("../app/acceso.html",location.href).href});$("feedback").textContent=error?error.message:"Revisa tu correo electrónico."}})();</script></body></html>
