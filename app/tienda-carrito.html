<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrito LOCAL | HTPWEB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/cart.js"></script>
<link rel="stylesheet" href="../assets/app.css?v=20261002-localstore1">
<style>
:root{--local-accent:#111827;--local-radius:18px}
body{background:#f6f7f9}.shell{max-width:860px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
.cardx{background:#fff;border:1px solid #e5e7eb;border-radius:var(--local-radius);padding:18px;margin-bottom:16px}
.cart-row{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f3}.cart-row:last-child{border-bottom:0}
.cart-row img{width:72px;height:72px;object-fit:cover;border-radius:12px;background:#eef2f7}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px}
.total{font-size:1.35rem;font-weight:800}.primary{background:var(--local-accent)!important;color:#fff!important;border:0!important}
.delivery-choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}.delivery-choice input{width:auto;margin-top:3px}
@media(max-width:560px){.shell{padding:10px}.cart-row{grid-template-columns:54px 1fr}.cart-row img{width:54px;height:54px}.cart-row>div:last-child{grid-column:2}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><div><h1 id="title" style="margin:0">Mi carrito</h1><small>Plataforma de HTPWEB</small></div><button id="backBtn">← Seguir comprando</button></div>
<div id="message" class="hidden"></div>
<section class="cardx"><div id="cart"></div><div id="summary"></div></section>
<section id="checkout" class="cardx hidden">
<h2>Finalizar pedido</h2>
<div class="form-grid"><div><label>Nombre *</label><input id="name" autocomplete="name"></div><div><label>WhatsApp</label><input id="phone" type="tel" autocomplete="tel"></div></div>
<label>Forma de entrega</label><div id="fulfillment"></div>
<div id="addressBox" class="hidden"><label>Dirección de entrega *</label><input id="address" placeholder="Calle, sector, referencia"></div>
<label>Observaciones</label><textarea id="notes" rows="3"></textarea>
<button id="sendBtn" class="btn-primary primary" style="width:100%;margin-top:14px">Enviar pedido por WhatsApp</button>
<p class="muted" style="margin-top:10px">El pedido se envía al WhatsApp del LOCAL. Si seleccionas un DELIVERY HTPWEB, el LOCAL verá cuál elegiste.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const params=new URLSearchParams(location.search);
const key=params.get("local")||"";
const source=(params.get("src")||"direct").toLowerCase();
const campaign=params.get("campaign")||"";
const localAnalyticsSession=sessionStorage.getItem("HTPWEB_LOCAL_ANALYTICS_SESSION")||crypto.randomUUID();
sessionStorage.setItem("HTPWEB_LOCAL_ANALYTICS_SESSION",localAnalyticsSession);
let store=null,items=[],products=new Map(),variants=new Map(),deliveries=[];
async function trackLocal(eventType,metadata={}){
 try{
  if(!store?.local?.id)return;
  await supabaseClient.rpc("record_local_storefront_event",{
   p_event_type:eventType,p_local_id:store.local.id,p_product_id:null,
   p_session_id:localAnalyticsSession,p_source:source,p_metadata:{campaign,...metadata}
  });
 }catch(e){console.warn("Analytics LOCAL:",e?.message||e);}
}
function scope(){return "LOCAL:"+store.local.id}
function money(v){return "$"+Number(v||0).toFixed(2)}
function normalizePhone(v){let d=String(v||"").replace(/\D/g,"");if(/^0\d{9}$/.test(d))d="593"+d.slice(1);else if(/^9\d{8}$/.test(d))d="593"+d;return d}
async function loadCart(){
 items=carritoObtener(scope());
 const productIds=[...new Set(items.filter(x=>x.product_id).map(x=>x.product_id))];
 const variantIds=[...new Set(items.filter(x=>x.variant_id).map(x=>x.variant_id))];
 if(productIds.length){const {data,error}=await supabaseClient.from("products").select("id,name,price,image_url,active,catalog_visible").in("id",productIds);if(error)throw error;(data||[]).forEach(x=>products.set(x.id,x));}
 if(variantIds.length){const {data,error}=await supabaseClient.from("product_variants").select("id,product_id,name,price,active").in("id",variantIds);if(error)throw error;(data||[]).forEach(x=>variants.set(x.id,x));}
 render();
}
function lineInfo(item){
 const p=products.get(item.product_id)||item.snapshot||{},v=item.variant_id?variants.get(item.variant_id):null;
 const price=Number(v?.price??item.snapshot?.price??p.price??0);return{p,v,price,name:p.name||item.snapshot?.name||"Producto"};
}
function subtotal(){return items.reduce((sum,i)=>sum+lineInfo(i).price*Number(i.quantity||0),0)}
function render(){
 $("title").textContent="Carrito · "+store.local.name;
 if(!items.length){$("cart").innerHTML='<p class="muted">Tu carrito está vacío.</p>';$("summary").innerHTML="";$("checkout").classList.add("hidden");return;}
 $("cart").innerHTML=items.map((i,idx)=>{const x=lineInfo(i);return '<div class="cart-row">'+
  (x.p.image_url?'<img src="'+esc(x.p.image_url)+'" alt="">':'<div></div>')+
  '<div><strong>'+esc(x.name)+'</strong>'+(x.v?'<small style="display:block">'+esc(x.v.name)+'</small>':"")+'<div>'+money(x.price)+'</div></div>'+
  '<div class="qty"><button data-minus="'+idx+'">−</button><strong>'+i.quantity+'</strong><button data-plus="'+idx+'">+</button><button data-remove="'+idx+'">×</button></div></div>'}).join("");
 $("summary").innerHTML='<div class="row between" style="margin-top:14px"><span>Subtotal</span><span class="total">'+money(subtotal())+'</span></div>';
 $("checkout").classList.remove("hidden");
 $("cart").querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>change(Number(b.dataset.minus),-1));
 $("cart").querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>change(Number(b.dataset.plus),1));
 $("cart").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>remove(Number(b.dataset.remove)));
}
function change(idx,delta){const i=items[idx],n=Math.max(0,Number(i.quantity)+delta);if(n===0)return remove(idx);items=carritoCambiarCantidad(scope(),i,n);render()}
function remove(idx){items=carritoEliminar(scope(),items[idx]);render()}
function renderFulfillment(){
 const s=store.settings,rows=[];
 if(s.pickup_enabled)rows.push({value:"PICKUP",label:"Retirar en "+store.local.name});
 if(s.own_delivery_enabled)rows.push({value:"OWN_DELIVERY",label:"Entrega propia del LOCAL"});
 if(s.htpweb_delivery_enabled)deliveries.forEach(d=>rows.push({value:"HTP:"+d.delivery_id,label:"DELIVERY HTPWEB · "+d.name}));
 $("fulfillment").innerHTML=rows.length?rows.map((r,i)=>'<label class="delivery-choice"><input type="radio" name="fulfillment" value="'+esc(r.value)+'" '+(i===0?"checked":"")+'> <span>'+esc(r.label)+'</span></label>').join(""):'<div class="error">Este LOCAL no tiene una forma de entrega habilitada.</div>';
 $("fulfillment").querySelectorAll("input").forEach(x=>x.onchange=syncAddress);
 syncAddress();
}
function syncAddress(){const v=document.querySelector('input[name="fulfillment"]:checked')?.value||"";$("addressBox").classList.toggle("hidden",v==="PICKUP"||!v)}
function buildMessage(){
 const name=$("name").value.trim(),delivery=document.querySelector('input[name="fulfillment"]:checked');
 if(!name)throw new Error("Escribe tu nombre.");if(!delivery)throw new Error("Selecciona una forma de entrega.");
 const address=$("address").value.trim();if(delivery.value!=="PICKUP"&&!address)throw new Error("Escribe la dirección de entrega.");
 const lines=["*NUEVO PEDIDO · "+store.local.name+"*","", "Cliente: "+name];
 const phone=$("phone").value.trim();if(phone)lines.push("Teléfono: "+phone);
 lines.push("","Productos:");
 items.forEach(i=>{const x=lineInfo(i);lines.push("• "+i.quantity+" × "+x.name+(x.v?" · "+x.v.name:"")+" — "+money(x.price*Number(i.quantity)))});
 lines.push("","Subtotal: "+money(subtotal()));
 if(delivery.value==="PICKUP")lines.push("Entrega: Retiro en LOCAL");
 else if(delivery.value==="OWN_DELIVERY")lines.push("Entrega: Delivery propio del LOCAL");
 else{const d=deliveries.find(x=>"HTP:"+x.delivery_id===delivery.value);lines.push("DELIVERY elegido: "+(d?.name||"HTPWEB"))}
 if(address)lines.push("Dirección: "+address);
 const notes=$("notes").value.trim();if(notes)lines.push("Observaciones: "+notes);
 lines.push("","Pedido enviado desde HTPWEB Local.");
 return lines.join("\n");
}
async function send(){
 try{
  if(!items.length)throw new Error("El carrito está vacío.");
  const to=normalizePhone(store.local.whatsapp);if(!/^\d{8,15}$/.test(to))throw new Error("El LOCAL no tiene un WhatsApp válido.");
  const text=buildMessage();
  await trackLocal("WHATSAPP_ORDER",{subtotal:subtotal(),fulfillment:document.querySelector('input[name="fulfillment"]:checked')?.value||""});
  window.open("https://wa.me/"+to+"?text="+encodeURIComponent(text),"_blank","noopener");
 }catch(e){$("message").textContent=e.message;$("message").className="error"}
}
async function init(){
 try{
  const {data,error}=await supabaseClient.rpc("public_local_storefront",{p_local_key:key});if(error)throw error;if(!data)throw new Error("Tienda no disponible.");
  store=data;if(store.settings.accent_color)document.documentElement.style.setProperty("--local-accent",store.settings.accent_color);
  const d=await supabaseClient.rpc("public_local_delivery_choices",{p_local_id:store.local.id});if(d.error)throw d.error;deliveries=Array.isArray(d.data)?d.data:[];
  $("backBtn").onclick=()=>{
    const next=new URL("tienda.html",location.href);next.searchParams.set("local",key);
    if(source!=="direct")next.searchParams.set("src",source);if(campaign)next.searchParams.set("campaign",campaign);
    location.href=next.toString();
  };
  $("sendBtn").onclick=send;
  await loadCart();renderFulfillment();
  if(items.length)trackLocal("CHECKOUT_VIEW",{items:items.length});
 }catch(e){$("message").textContent=e.message||"No se pudo abrir el carrito.";$("message").className="error"}
}
init();
</script>
</body></html>
