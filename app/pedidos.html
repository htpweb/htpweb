<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis pedidos | HTPWEB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config/supabase.js"></script>
<script src="../config/negocio.js"></script>
<script src="../config/auth.js"></script>
<script src="../config/orders.js"></script>
<script src="../config/ads.js"></script>
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header><div class="header-row">
  <div><div class="brand">Mis pedidos</div><small id="deliveryName"></small></div>
  <div class="header-actions">
    <a class="btn btn-light" id="shopLink" href="../index.html">Volver a la tienda</a>
    <a class="btn btn-primary hidden" id="cartLink" href="#">Carrito</a>
  </div>
</div></header>
<main>
  <section class="card">
    <div class="row between"><h1>Mis pedidos</h1><button class="btn btn-muted" id="refreshBtn" disabled>Actualizar</button></div>
    <p class="muted">Consulta tus compras en este DELIVERY. Puedes cancelar un pedido mientras esté pendiente.</p>
    <div id="message" class="hidden" role="status" aria-live="polite"></div>
  </section>
  <section id="detail" class="card hidden" aria-label="Detalle del pedido" tabindex="-1"></section>
  <div id="orders" aria-live="polite"><div class="card empty">Cargando pedidos…</div></div>
  <nav class="row between" aria-label="Páginas de pedidos">
    <button id="prevBtn" class="btn btn-muted" disabled>Anterior</button>
    <span id="pageLabel"></span>
    <button id="nextBtn" class="btn btn-muted" disabled>Siguiente</button>
  </nav>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const money = value => '$' + Number(value || 0).toFixed(2);
const statusNames = { PENDING:'Pendiente', CONFIRMED:'Confirmado', PREPARING:'En preparación', READY:'Listo', EN_ROUTE:'En camino', DELIVERED:'Entregado', CANCELLED:'Cancelado' };
const statusText = value => statusNames[value] || 'Estado por actualizar';
const dateText = value => new Date(value).toLocaleString('es-EC', { timeZone:'America/Guayaquil' });
let delivery = null;
let page = 0;
let hasMore = false;
let busy = false;
let selectedId = new URLSearchParams(location.search).get('order') || '';
let trackingChannel = null;
let trackingOrderId = '';
let trackingMap = null;
let trackingMarker = null;

function message(text, success = false) {
  $('message').textContent = text;
  $('message').className = text ? (success ? 'success' : 'error') : 'hidden';
}
function controls() {
  $('refreshBtn').disabled = busy || !delivery;
  $('prevBtn').disabled = busy || page === 0;
  $('nextBtn').disabled = busy || !hasMore;
  document.querySelectorAll('[data-order], #cancelBtn, #closeDetailBtn').forEach(button => { button.disabled = busy; });
}
async function stopCustomerTracking(clearVisual = true) {
  const channel = trackingChannel;
  trackingChannel = null;
  trackingOrderId = '';
  if (channel) {
    try { await supabaseClient.removeChannel(channel); } catch {}
  }
  if (clearVisual) {
    if (trackingMap) {
      trackingMap.remove();
      trackingMap = null;
    }
    trackingMarker = null;
  }
}

function trackingReasonText(reason) {
  const labels = {
    PLAN_DISABLED: 'Este DELIVERY no incluye tracking del cliente en su plan.',
    ORDER_NOT_EN_ROUTE: 'El seguimiento estará disponible cuando el pedido salga a ruta.'
  };
  return labels[reason] || 'Seguimiento no disponible.';
}

function renderTrackingLocation(location) {
  const status = $('trackingStatus');
  const host = $('trackingMap');
  if (!status || !host || !location) return;

  const lat = Number(location.latitude);
  const lng = Number(location.longitude);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

  host.style.display = 'block';
  if (!trackingMap) {
    trackingMap = L.map(host).setView([lat, lng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(trackingMap);
  }

  if (!trackingMarker) trackingMarker = L.marker([lat, lng]).addTo(trackingMap);
  else trackingMarker.setLatLng([lat, lng]);

  trackingMap.setView([lat, lng], Math.max(trackingMap.getZoom(), 16));
  setTimeout(() => trackingMap?.invalidateSize(), 0);

  const captured = location.captured_at ? dateText(location.captured_at) : 'ahora';
  const accuracy = Number.isFinite(Number(location.accuracy_m))
    ? ' · precisión ±' + Math.round(Number(location.accuracy_m)) + ' m'
    : '';
  status.textContent = 'Repartidor ubicado · ' + captured + accuracy;
}

async function startCustomerTracking(orderId) {
  await stopCustomerTracking();
  const status = $('trackingStatus');
  const host = $('trackingMap');
  if (!status || !host) return;

  try {
    const { data: snapshot, error } = await supabaseClient.rpc('customer_order_tracking_snapshot', {
      p_order_id: orderId
    });
    if (error) throw error;

    if (!snapshot?.enabled) {
      status.textContent = trackingReasonText(snapshot?.reason);
      host.style.display = 'none';
      return;
    }

    trackingOrderId = orderId;
    if (snapshot.location) renderTrackingLocation(snapshot.location);
    else status.textContent = 'Esperando la primera ubicación del repartidor…';

    if (!snapshot.topic) return;

    trackingChannel = supabaseClient
      .channel(snapshot.topic, { config: { private: true } })
      .on('broadcast', { event: 'location' }, ({ payload }) => {
        if (trackingOrderId === orderId) renderTrackingLocation(payload);
      })
      .on('broadcast', { event: 'tracking_ended' }, ({ payload }) => {
        if (trackingOrderId !== orderId) return;
        const label = payload?.status === 'DELIVERED'
          ? 'Entrega completada.'
          : 'Seguimiento finalizado.';
        if ($('trackingStatus')) $('trackingStatus').textContent = label;
        void stopCustomerTracking(false);
      })
      .subscribe((channelStatus) => {
        if (channelStatus === 'CHANNEL_ERROR' || channelStatus === 'TIMED_OUT') {
          if ($('trackingStatus')) {
            $('trackingStatus').textContent = 'No se pudo conectar al tracking en vivo. Usa Actualizar para reintentar.';
          }
        }
      });
  } catch (e) {
    status.textContent = e.message || 'No se pudo iniciar el seguimiento.';
    host.style.display = 'none';
  }
}

function renderOrders(orders) {
  $('pageLabel').textContent = `Página ${page + 1}`;
  $('orders').innerHTML = orders.length ? orders.map(order => `
    <article class="card">
      <p style="overflow-wrap:anywhere"><strong>Pedido ${esc(order.id)}</strong></p>
      <p class="muted">${esc(dateText(order.created_at))}</p>
      <p><strong>${esc(statusText(order.status))}</strong> · Total ${money(order.total)}</p>
      <button class="btn btn-dark" data-order="${esc(order.id)}">Ver detalle</button>
    </article>`).join('') : '<div class="card empty">No hay pedidos en esta página. Tus compras en este DELIVERY aparecerán aquí.</div>';
  document.querySelectorAll('[data-order]').forEach(button => {
    button.onclick = () => showDetail(button.dataset.order);
  });
}
async function loadCustomerDeliveryProof(orderId) {
  const { data, error } = await supabaseClient.rpc('customer_order_delivery_proof_snapshot', {
    p_order_id: orderId
  });
  if (error) throw error;
  return data || null;
}

async function viewCustomerDeliveryProofMedia(orderId, kind) {
  const popup = window.open('about:blank', '_blank');
  try {
    const { data, error } = await supabaseClient.functions.invoke('delivery-proof-view', {
      body: { order_id: orderId, kind }
    });
    if (error) throw error;
    if (!data?.ok || !data?.signed_url) throw new Error(data?.error || 'Evidencia no disponible.');
    if (popup) {
      popup.opener = null;
      popup.location.href = data.signed_url;
    } else {
      window.open(data.signed_url, '_blank', 'noopener,noreferrer');
    }
  } catch (e) {
    try { popup?.close(); } catch {}
    message(e.message || 'No se pudo abrir la evidencia.');
  }
}

function customerProofCard(proof, orderId) {
  if (!proof?.enabled) return '';
  const rows = [];
  if (proof.require_pin) {
    if (proof.pin_verified) {
      rows.push('<p>✅ PIN verificado</p>');
    } else if (proof.pin) {
      rows.push('<div class="card" style="margin:10px 0"><div class="muted">PIN de entrega</div><div style="font-size:2rem;font-weight:700;letter-spacing:.18em">' + esc(proof.pin) + '</div><small class="muted">Compártelo con el repartidor únicamente cuando recibas tu pedido.</small></div>');
    } else {
      rows.push('<p>⏳ PIN pendiente</p>');
    }
  }
  if (proof.require_photo) {
    rows.push(proof.photo_uploaded
      ? '<p>✅ Foto de entrega <button class="btn btn-muted" type="button" data-customer-proof-view="' + esc(orderId) + '" data-proof-kind="PHOTO">Ver foto</button></p>'
      : '<p>⏳ Foto de entrega pendiente</p>');
  }
  if (proof.require_signature) {
    rows.push(proof.signature_uploaded
      ? '<p>✅ Firma registrada <button class="btn btn-muted" type="button" data-customer-proof-view="' + esc(orderId) + '" data-proof-kind="SIGNATURE">Ver firma</button></p>'
      : '<p>⏳ Firma pendiente</p>');
  }
  return '<div class="card" style="margin-top:16px"><h3>Confirmación de entrega</h3>' + rows.join('') +
    '<p class="muted">' + (proof.ready ? 'Prueba de entrega completa.' : 'La entrega no puede finalizar hasta completar la prueba exigida.') + '</p></div>';
}
async function renderDetail() {
  await stopCustomerTracking();
  $('detail').classList.add('hidden');
  $('detail').innerHTML = '';
  if (!selectedId) return;
  const order = await obtenerPedidoCliente(delivery.id, selectedId);
  if (!order) throw new Error('Pedido no disponible en esta cuenta y DELIVERY.');
  const deliveryProof = ['EN_ROUTE','DELIVERED'].includes(order.status)
    ? await loadCustomerDeliveryProof(order.id)
    : null;
  const groups = (order.order_locals || []).map(local => `
    <div class="cart-group">
      <h3>${esc(local.locals?.name || 'LOCAL')}</h3>
      <p>${esc(statusText(local.status))}</p>
      ${(order.order_items || []).filter(item => item.local_id === local.local_id).map(item => `
        <div class="cart-item"><div><strong>${esc(item.product_name)}</strong>
        ${item.variant_name ? `<div class="muted">${esc(item.variant_name)}</div>` : ''}
        <div>${esc(item.quantity)} × ${money(item.unit_price)}</div></div><strong>${money(item.subtotal)}</strong></div>`).join('')}
    </div>`).join('');
  $('detail').innerHTML = `
    <button class="btn btn-muted" id="closeDetailBtn">Cerrar detalle</button>
    <h2 style="overflow-wrap:anywhere">Pedido ${esc(order.id)}</h2>
    <p>${esc(dateText(order.created_at))} · <strong>${esc(statusText(order.status))}</strong></p>
    <p><strong>Entrega:</strong> ${esc(order.delivery_address)}</p>
    ${groups}
    <div class="summary-line"><span>Productos</span><strong>${money(order.subtotal)}</strong></div>
    <div class="summary-line"><span>Delivery</span><strong>${money(order.delivery_fee)}</strong></div>
    <div class="summary-line total"><span>Total</span><strong>${money(order.total)}</strong></div>
    ${order.status === 'EN_ROUTE' ? '<div id="trackingCard" class="card" style="margin-top:16px"><h3>Seguimiento en vivo</h3><p id="trackingStatus" class="muted">Conectando con el repartidor…</p><div id="trackingMap" style="height:320px;border-radius:12px;display:none"></div></div>' : ''}
    ${order.status === 'PENDING' ? '<button class="btn btn-danger" id="cancelBtn">Cancelar pedido</button>' : ''}`;
  $('detail').classList.remove('hidden');
  $('closeDetailBtn').onclick = () => {
    selectedId = '';
    history.replaceState(null, '', urlDelivery('pedidos.html'));
    void stopCustomerTracking();
    $('detail').classList.add('hidden');
    $('detail').innerHTML = '';
  };
  if ($('cancelBtn')) $('cancelBtn').onclick = cancelSelected;
  if (order.status === 'EN_ROUTE') await startCustomerTracking(order.id);
}
async function reload(targetPage = page) {
  if (busy || !delivery) return;
  busy = true;
  controls();
  message('');
  $('orders').innerHTML = '<div class="card empty">Cargando pedidos…</div>';
  await stopCustomerTracking();
  $('detail').classList.add('hidden');
  try {
    const result = await listarPedidosCliente(delivery.id, targetPage);
    page = targetPage;
    hasMore = result.hasMore;
    renderOrders(result.orders);
    await renderDetail();
  } catch (e) {
    message(e.message || 'No se pudieron cargar los pedidos.');
    if ($('orders').textContent.includes('Cargando pedidos')) $('orders').innerHTML = '';
    hasMore = false;
  } finally { busy = false; controls(); }
}
async function showDetail(id) {
  if (busy) return;
  busy = true;
  controls();
  message('');
  selectedId = id;
  history.replaceState(null, '', urlDelivery('pedidos.html', {order:id}));
  try {
    await renderDetail();
    $('detail').scrollIntoView({behavior:'smooth', block:'start'});
    $('detail').focus({preventScroll:true});
  } catch (e) { message(e.message || 'No se pudo cargar el pedido.'); }
  finally { busy = false; controls(); }
}
async function cancelSelected() {
  if (busy || !selectedId || !confirm('¿Cancelar este pedido pendiente? Esta acción no se puede deshacer.')) return;
  busy = true;
  controls();
  let outcome = '';
  let success = false;
  try {
    await cancelarPedidoCliente(delivery.id, selectedId);
    outcome = 'Pedido cancelado.';
    success = true;
  } catch (e) { outcome = e.message || 'No se pudo cancelar el pedido.'; }
  finally { busy = false; }
  await reload();
  // Conserva también un posible error de recarga; no muestra datos antiguos como actuales.
  const reloadError = $('message').textContent;
  message(reloadError ? `${outcome} ${reloadError}` : outcome, success && !reloadError);
}
async function init() {
  try {
    if (!await obtenerUsuarioActual()) { irAAcceso(rutaActualRelativa()); return; }
    delivery = await cargarNegocio();
    $('deliveryName').textContent = delivery.name;
    $('shopLink').href = urlDelivery('index.html');
    $('cartLink').href = urlDelivery('carrito.html');
    $('cartLink').classList.remove('hidden');
    await reload();
  } catch (e) { $('orders').innerHTML = ''; message(e.message || 'No se pudieron cargar los pedidos.'); }
}
$('refreshBtn').onclick = () => reload();
$('prevBtn').onclick = () => reload(page - 1);
$('nextBtn').onclick = () => reload(page + 1);
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') {
    void stopCustomerTracking();
    $('orders').innerHTML = '';
    $('detail').innerHTML = '';
    irAAcceso(rutaActualRelativa());
  }
});
init();
</script>
</body>
</html>
