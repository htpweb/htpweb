<body>
<main class="claim-shell">
<div class="row between" style="gap:12px;flex-wrap:wrap"><div><h1>Reclamar mi LOCAL</h1><p class="muted">Si tu negocio ya estÃ¡ en HTPWEB, solicita administrarlo con tu propia cuenta.</p></div><a class="btn btn-muted" href="../index.html">Volver</a></div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function show(t,type="error"){$("message").textContent=t;$("message").className=type==="success"?"success":"error"}
async function loadClaims(){
 const {data,error}=await supabaseClient.rpc("my_local_claim_requests");if(error)throw error;
 const rows=Array.isArray(data)?data:[];
 $("claims").innerHTML=rows.length?rows.map(x=>'<div class="row between" style="padding:8px 0;border-bottom:1px solid #eee"><span><strong>'+esc(x.local_name)+'</strong><small style="display:block">'+new Date(x.created_at).toLocaleDateString("es-EC")+'</small></span><span class="badge">'+esc(x.applied_at?"APLICADA":x.status)+'</span></div>').join(""):'No tienes solicitudes de reclamaciÃ³n.';
}
async function search(){
 const q=$("search").value.trim();
 const {data,error}=await supabaseClient.rpc("claimable_locals",{p_search:q||null});if(error)throw error;
 const rows=Array.isArray(data)?data:[];
 $("results").innerHTML=rows.length?rows.map(x=>'<article class="claim-card">'+
   (x.logo_url?'<img src="'+esc(x.logo_url)+'" alt="">':"")+
   '<h3>'+esc(x.name)+'</h3><p class="muted">'+esc([x.address,x.canton,x.province].filter(Boolean).join(" Â· "))+'</p>'+
   (x.pending_claim?'<button disabled>ReclamaciÃ³n en revisiÃ³n</button>':'<button class="btn-primary" data-claim="'+x.id+'">Este es mi negocio</button>')+
   '</article>').join(""):'<div class="muted">No encontramos LOCAL disponibles con esa bÃºsqueda.</div>';
 $("results").querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>submitClaim(b.dataset.claim));
}
async function submitClaim(localId){
 if(!confirm("Â¿Solicitar administrar este LOCAL? MASTER revisarÃ¡ la reclamaciÃ³n antes de entregarte el control."))return;
 try{
  await supabaseClient.rpc("submit_local_claim",{p_local_id:localId,p_evidence:{source:"SELF_SERVICE",note:"Solicitud realizada desde Reclamar mi LOCAL"}}).then(({error})=>{if(error)throw error});
  show("Solicitud enviada. HTPWEB la revisarÃ¡ antes de activar el control del LOCAL.","success");await Promise.all([loadClaims(),search()]);

init().catch(e=>show(e.message||"No se pudo abrir la reclamaciÃ³n."));
